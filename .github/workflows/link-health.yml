name: Link health

# ROADMAP.md item 308: Mondays, one polite request per upcoming event link.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: link-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check links
        run: python scripts/link_health.py

      - name: Commit link health
        run: |
          git config user.name "local-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/link_health.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record link health [skip ci]"
            attempt=1
            until git push; do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::Failed to push after $attempt attempts."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
            done
          fi
