name: Build region digests

on:
  schedule:
    # Every Monday 12:00 UTC (07:00 America/Chicago standard time).
    - cron: "0 12 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "config/**"
      - ".github/workflows/build-digest.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build digest
        run: python scripts/build_digest.py

      - name: Commit generated site
        run: |
          git config user.name "local-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build region digests [skip ci]"
            git push
          fi
