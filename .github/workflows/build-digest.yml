name: Build region digests

on:
  schedule:
    # Monday 08:17 UTC (~03:17 America/Chicago) - moved here by
    # ROADMAP.md item 168. weekend_dates() only changes what "this
    # weekend" means at the Sunday->Monday local-midnight boundary, so a
    # weekly rebuild here is enough by construction - the bug was
    # timing, not frequency. The old 12:00 UTC (~07:00 Chicago) slot
    # left the site advertising an already-finished weekend for
    # anywhere from a few hours to most of a morning, every week -
    # exactly the freshness gap item 163's "last checked" line exists
    # to make visible, not create. Given this repo's own measured
    # scheduled-run lateness (5h27m-6h54m, see send-newsletter.yml),
    # this lands mid-morning Chicago at worst and shortly after
    # midnight at best - both strictly better than a slot that starts
    # the week already behind. The offset minute (":17") dodges the
    # documented delay spike clustered at ":00", same reasoning as
    # send-newsletter.yml's own ":37".
    - cron: "17 8 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "config/**"
      - ".github/workflows/build-digest.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build digest
        run: python scripts/build_digest.py

      # ROADMAP.md Phase 11 #51: build_digest.py exits non-zero when a
      # source's fetch count silently drops to 0 despite a positive
      # trailing history - a likely-dead scraper, not a normal empty
      # week. `if: always()` keeps this step (and the site it publishes)
      # running even then, so the only thing a regression changes is this
      # job's own conclusion (failure -> GitHub emails the owner at no
      # cost) - it never withholds otherwise-good output or the health
      # history data/source_health.json needs to keep accumulating.
      - name: Commit generated site
        if: always()
        run: |
          git config user.name "local-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/source_health.json data/weekend_signal.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build region digests [skip ci]"
            git push
          fi
