name: Send weekly newsletter

on:
  schedule:
    # Wednesday 22:37 UTC (~17:37 Chicago), not Thursday morning — moved
    # here by ROADMAP.md item 110, after this repo's own build-digest.yml
    # cron history proved GitHub Actions scheduled runs are not
    # punctual: three measured runs, all 5h27m–6h54m late. A cron
    # anchored to the actual send time just mails whenever the (possibly
    # hours-late) job happens to run, which quietly breaks the researched
    # Thursday-morning slot (ROADMAP.md Phase 11 #31) it exists to serve.
    #
    # The fix: run the night before and let config/newsletter.yaml's
    # `send.mode: "schedule"` hand the real delivery moment to
    # Buttondown, which holds the email and sends it precisely at the
    # `publish_date` scripts/send_newsletter.py computes (next Thursday
    # 07:00 America/Chicago). This job only needs to run *sometime* in
    # the several-hour window before that, which is exactly what GitHub
    # reliably provides even when it isn't punctual - and running the
    # night before leaves a real margin to catch a bad issue before
    # Buttondown ever sends it. The offset minute (":37") dodges the
    # documented delay spike clustered at ":00".
    - cron: "37 22 * * 3"
  # Manual runs matter more than usual here: this is how the first send
  # gets tested without waiting a week.
  #
  # dry_run defaults to FALSE deliberately. It shipped defaulting to true
  # and the first manual run silently did nothing while reporting
  # success - clicking "Run workflow" means "do the thing", and what the
  # thing is already lives in config/newsletter.yaml's send.mode. Tick
  # the box to validate without sending.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only - do NOT create or send anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Built fresh rather than trusting whatever docs/ happens to hold:
      # the build commit lands via a separate workflow on its own
      # schedule, and mailing a stale digest is worse than not mailing.
      # send_newsletter.py deliberately does not build, so a failure here
      # stops the job before anything can be sent.
      - name: Build digest
        run: python scripts/build_digest.py

      - name: Send to Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/send_newsletter.py --dry-run
          else
            python scripts/send_newsletter.py
          fi
