name: Backfill send metrics

on:
  schedule:
    # Daily, not weekly like the other newsletter workflows - opens and
    # clicks accrue gradually after a send, and each entry is only
    # backfilled once it's METRICS_BACKFILL_MIN_AGE old
    # (scripts/backfill_send_metrics.py), so a daily check is what
    # actually catches an entry promptly once it crosses that age
    # rather than making it wait for the next weekly cron. The offset
    # minute (":23") dodges the delay spike this repo's own other
    # workflows already found clustered at ":00".
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ROADMAP.md item 187: deliberately its own workflow, not a step
      # added to send-newsletter.yml - a metrics fetch failing must
      # never be able to affect a send, and giving the two no shared
      # failure path at all is the simplest way to guarantee that.
      - name: Backfill metrics
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/backfill_send_metrics.py

      # Same reasoning as send-newsletter.yml's own commit step: the
      # script writes to this runner's local checkout, which is
      # discarded the moment the job ends, so the record only survives
      # if it's pushed back. `if: always()` so a later, unrelated
      # failure can't withhold metrics that were actually fetched.
      - name: Commit updated send history
        if: always()
        run: |
          git config user.name "local-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/send_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Backfill send metrics [skip ci]"
            git push
          fi
