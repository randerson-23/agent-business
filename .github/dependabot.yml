# Security updates for the things this repo runs unattended: the GitHub
# Actions it uses (several workflows hold write tokens and secrets) and the
# Python packages the build installs on every run.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
