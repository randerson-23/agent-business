# Region config for Palatine, IL (ZIP 60067) — the fourth region, added
# per ROADMAP.md item 50's stated scale strategy: keep monetizing the
# existing regions deeply, but keep adding neighboring towns anyway since
# each one costs almost nothing.
#
# Status as of 2026-08-30 (fourteenth research pass, ROADMAP.md item 63
# follow-up): the TLS error below wasn't a blocked/misconfigured host -
# it's the wrong domain entirely, same shape as the Des Plaines bug found
# earlier this same pass. WebSearch confirms the Village's real site is
# **palatine.il.us**, not palatineil.gov - that ".gov" hostname simply
# doesn't answer for the real Village. Source `url` switched below to
# https://www.palatine.il.us/CivicAlerts.aspx (the real "News Flash"
# list, confirmed via WebSearch), still relying on the keyword fallback
# since no individual news-item URL shape has been confirmed yet. Not yet
# re-verified against a live build since the switch.
#
# Status as of 2026-08-29 (confirmed against the real GitHub Actions build
# on main, run 33246555815, 09:54 UTC - read directly from its job log,
# just hours after this region was added, not inferred from generated
# HTML):
#   - Village News: palatineil.gov **failed with a TLS/SSL error**
#     ("TLSV1_UNRECOGNIZED_NAME") rather than a 403/404 - a strong signal
#     this exact hostname is wrong (no valid HTTPS host answers to that
#     name), not just blocked. Root cause found 2026-08-30: wrong domain,
#     see above.
#   - Library Events: palatinelibrary.org returned a **403 Forbidden** on
#     that first run - but two later real builds (13:01 UTC the same day,
#     and again since) both returned 6 real items via the keyword
#     fallback, so that 403 was transient (a momentary block or rate
#     limit), not a standing one like Mount Prospect's. One returned link
#     (`/events/upcoming?program_types[..]=..`) looks like the real
#     events-calendar path - worth pointing `url` there directly and
#     adding a `detail_link_pattern` once a real per-event URL shape is
#     confirmed, same upgrade already done for Des Plaines Park District.
#   - Park District Events: palatineparks.org **CONFIRMED to resolve** and
#     returned 6 real items (e.g. "Summer Camps", "Festival of Cultures",
#     "Calendar of Events") via the keyword fallback - real, useful
#     Park District links, though not yet matched via a
#     `detail_link_pattern` to individual dated events specifically.
#   - School Calendar (District 15 & District 211): added 2026-08-30
#     (fourteenth research pass, ROADMAP.md item 32 follow-up) - two real
#     URLs found via web search. CONFIRMED BROKEN 2026-09-15 against the
#     real build (run 34983302071): both 404. See the source blocks below
#     for the full finding - the same "real, indexed URL isn't the same
#     as a live one" failure mode Arlington Heights' District 25 source
#     also hit this same run, not specific to this region's sources.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build - if any of the domains
# above turn out to be wrong, this region simply falls back to the
# evergreen entries below until a real link surfaces. (The Village News
# domain fix above IS confirmed working in this same run: 2 real items.)

region:
  id: "palatine-60067"
  name: "Palatine"
  zip: "60067"
  state: "IL"
  timezone: "America/Chicago"
  tagline: "Village news, library events, and park district programs — northwest of Mount Prospect."
  # Reused from templates/hub.html.j2's existing ZIP_COORDS table (already
  # present there for the "distance from me" nearby-ZIP fallback before
  # this region existed) rather than a fresh guess - a rough town-center
  # approximation, not a specific venue's address.
  lat: 42.1103
  lon: -88.0342
  # Optional: force the /region/ page's "Editor's Pick" card to a specific
  # item by its exact `url` (ROADMAP.md Phase 11 #16). Unset by default -
  # the heuristic (soonest dated item, ties broken by free/kid-friendly)
  # picks automatically otherwise. Uncomment and set to override:
  # editors_pick_url: "https://www.palatinelibrary.org/"

sources:
  - name: "Village of Palatine — News"
    type: html_events
    # Fixed 2026-08-30 (see header note): the Village's real domain is
    # palatine.il.us, not palatineil.gov - confirmed via WebSearch against
    # the Village's own site. Still relies on the keyword fallback rather
    # than an invented detail_link_pattern (no individual news-item URL
    # shape confirmed yet).
    url: "https://www.palatine.il.us/CivicAlerts.aspx"
    keywords: ["news", "press release", "mayor", "council", "meeting", "notice", "advisory", "alert", "closure"]
    section: "Village News"
    enabled: true

  - name: "Palatine Public Library District — Events"
    type: html_events
    # Confirmed live 2026-08-29 (see header note) - /events already
    # returns 6 real items via keyword fallback, one of which
    # (/events/upcoming?program_types[..]=..) points at a real filtered
    # events-calendar view. Pointed url at the unfiltered /events/upcoming
    # page itself on that evidence, still no detail_link_pattern until a
    # real per-event URL shape is confirmed.
    url: "https://www.palatinelibrary.org/events/upcoming"
    keywords: ["event", "class", "program", "story", "camp", "concert", "workshop", "book"]
    section: "Library Events"
    enabled: true

  - name: "Palatine Park District — Events"
    type: html_events
    # Unconfirmed guess (see header note) - deliberately html_events, not
    # ics, since no calendar-platform export URL has been confirmed here.
    url: "https://www.palatineparks.org/events"
    keywords: ["event", "class", "program", "camp", "swim", "sport", "concert", "festival"]
    section: "Park District Events"
    enabled: true

  - name: "Community Consolidated School District 15 — Calendar"
    type: ics
    # ROADMAP.md Phase 11 #32 follow-up (fourteenth research pass,
    # 2026-08-30): same "school calendars as a data source" treatment
    # already confirmed working for Mount Prospect's District 57, and
    # just added for Arlington Heights' District 25 (see those configs'
    # comments) - found via web search of ccsd15.net's own "ICal Feed"
    # page, a real indexed page at this exact URL, same
    # `site/handlers/icalfeed.ashx?MIID=<id>` pattern D25 uses (same CMS
    # platform, not a copy-guess - each MIID was found independently).
    # CONFIRMED BROKEN 2026-09-15 against the real build (run
    # 34983302071): 404. Same failure mode as D25's own source in
    # Arlington Heights' config this same run - a real, indexed URL
    # isn't the same as a live one; the module instance ID has
    # apparently rotated or expired since being indexed, which no amount
    # of re-searching turned up a fix for (two follow-up WebSearch passes
    # both surfaced this identical, still-broken URL). Left enabled since
    # it fails soft regardless.
    url: "webcal://www.ccsd15.net/site/handlers/icalfeed.ashx?MIID=5415"
    section: "School Calendar"
    enabled: true

  - name: "Township High School District 211 — Calendar"
    type: rss
    # Companion to the CCSD15 source above: D211 (the shared high school
    # district) has no icalfeed.ashx-style export, but web search found a
    # real "Subscribe to RSS" page on adc.d211.org with this exact feed
    # URL - a genuine finding, not the PDF-only dead end District 214 was
    # for Mount Prospect and Arlington Heights. build_digest.py's `rss`
    # source type (already used for Mount Prospect's library) applies
    # here since this is a standard RSS export, not ICS. CONFIRMED BROKEN
    # 2026-09-15 against the real build (run 34983302071): 404, and the
    # error message shows the query string got dropped somewhere along
    # the way ("404 ... for url: https://adc.d211.org/site/RSS" - no
    # params), suggesting either a redirect that lost them or a URL
    # shape that never actually worked as a direct link, unlike D25's
    # and CCSD15's icalfeed.ashx URLs which at least 404 on the exact
    # URL given. WebSearch couldn't turn up a working replacement - see
    # ROADMAP.md item 32's writeup. Left enabled since it fails soft
    # regardless.
    url: "https://adc.d211.org/site/RSS.aspx?DomainID=4&ModuleInstanceID=9762&PageID=1&PMIID=9953"
    section: "School Calendar"
    enabled: true

# Known, dated, recurring annual events (ROADMAP.md Phase 11 #67/#68) -
# see the Mount Prospect config for the full rationale. Same urgency as
# Des Plaines' entry below: WebSearch (2026-09-15) found the Rotary Club
# of Palatine's Oktoberfest running THIS SAME weekend, Fri-Sun Sept
# 18-20, 2026, in Downtown Palatine - confirmed hours per day (and
# Saturday's "Family Day" designation) from palatinerotary.org's own
# Oktoberfest page, not this region's own sources (none of them mention
# it). One entry per day since the hours - and Saturday's family
# programming specifically - differ each day. Not yet confirmed by a
# live fetch of the linked page.
annual_events:
  - title: "Palatine Oktoberfest (Friday)"
    date: "2026-09-18"
    detail: "German beer, food & music return to Downtown Palatine. 5pm–midnight, N Smith & W Slade St. Free entry."
    url: "https://palatinerotary.org/Oktoberfest.php"
    tags: ["free", "outdoor"]
  - title: "Palatine Oktoberfest — Family Day (Saturday)"
    date: "2026-09-19"
    detail: "Family Day: games, crafts & entertainment plus German beer, food & music. Noon–midnight, N Smith & W Slade St. Free entry."
    url: "https://palatinerotary.org/Oktoberfest.php"
    tags: ["free", "kid_friendly", "outdoor"]
  - title: "Palatine Oktoberfest (Sunday)"
    date: "2026-09-20"
    detail: "German beer, food & music wind down Downtown Palatine's Oktoberfest. Noon–6pm, N Smith & W Slade St. Free entry."
    url: "https://palatinerotary.org/Oktoberfest.php"
    tags: ["free", "outdoor"]

