guides:
  - slug: "fall-family-guide"
    title: "Fall Family Guide"
    summary: "A living guide to fall in Palatine — seasonal park district programs, library fall programming, and where the Village posts official trick-or-treat hours. Pulls from the same civic sources as the weekly digest, organized by season instead of by week."
    items:
      - title: "Fall & Halloween programs — Palatine Park District"
        detail: "Pumpkin-themed drop-ins, fall break camps, and seasonal rec programs. Dates and registration change every year — check the current program guide."
        url: "https://www.palatineparks.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Fall programs — Palatine Public Library District"
        detail: "Seasonal storytimes and programs for all ages — a solid pick for a rainy fall Saturday."
        url: "https://www.palatinelibrary.org/"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Official trick-or-treat hours & fall notices"
        detail: "The Village posts that year's official trick-or-treat hours and other fall community notices on its news page each October."
        url: "https://www.palatine.il.us/CivicAlerts.aspx"
        tags: ["kid_friendly", "free"]

  # ROADMAP.md Phase 11 #15 - see the Mount Prospect config for the
  # rationale; same civic-source-only discipline here.
  - slug: "birthday-parties-and-kids-classes"
    title: "Birthday Parties & Kids' Classes"
    summary: "Where Palatine families look for party venues, rec classes, and enrichment programs — the small set of standing civic options, plus local businesses as they join the directory below."
    items:
      - title: "Birthday parties & rentals — Palatine Park District"
        detail: "Pool parties, gym space, and themed party packages through the Park District — check current pricing, room availability, and booking windows."
        url: "https://www.palatineparks.org/"
        tags: ["kid_friendly"]
      - title: "Kids' classes & camps — Palatine Park District"
        detail: "Swim lessons, sports, dance, and seasonal camps for all ages — browse the current program guide for schedules and registration."
        url: "https://www.palatineparks.org/"
        tags: ["kid_friendly"]
      - title: "Kids' programs — Palatine Public Library District"
        detail: "Storytimes and craft programs for kids — check the current schedule for ages and registration."
        url: "https://www.palatinelibrary.org/"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Local party venues, entertainers & tutoring centers"
        detail: "Private businesses appear here as they join the local directory — see what's currently listed."
        url: "https://randerson-23.github.io/agent-business/palatine-60067/directory/"
        tags: ["kid_friendly"]

  # ROADMAP.md Phase 11 #49 (ninth research pass) built this guide hedged
  # and unsourced, pointed at the wrong Village domain; #63 (fourteenth
  # research pass, 2026-08-30) replaced it with WebSearch-sourced real
  # facts, same treatment already applied to Mount Prospect (PR #86),
  # Arlington Heights (PR #87), and Des Plaines (PR #88) - see those
  # configs' comments for the full rationale. Every fact and link below is
  # sourced, not guessed; verify against the linked page before treating a
  # number as current.
  #
  # Real finding, not assumed: Palatine eliminated its own vehicle sticker
  # program in 2022 (Daily Herald: "Palatine eliminates vehicle sticker
  # requirement") - the earliest of the four regions built so far
  # (Des Plaines 2020, Palatine 2022, Mount Prospect and Arlington
  # Heights both 2024). The pattern now holds 4 for 4 regions checked.
  # Also found in the same research pass: the Village's real domain is
  # palatine.il.us, not palatineil.gov (see the source block above) - this
  # guide's Village link was silently pointing at the wrong domain the
  # whole time, same bug shape as Des Plaines'.
  - slug: "new-to-town"
    title: "New to Town"
    summary: "The practical first-week checklist for anyone new to Palatine — utilities and refuse/recycling, a library card, Park District registration, and which school districts actually serve your address. Pulls from the same civic sources as the weekly digest, organized for someone who just moved in rather than someone browsing this week's events."
    items:
      - title: "Village services, utilities, refuse & recycling"
        detail: "There's no vehicle sticker to buy — Palatine eliminated its program in 2022, saving households an average of $75. Water/sewer is billed bi-monthly by the Village (Utility Billing, 847-359-9082); refuse, recycling, and yard waste (April-November) are collected weekly by Groot — put everything at the curb by 6:30 a.m. on your collection day."
        url: "https://www.palatine.il.us/667/New-Residents"
        tags: []
      - title: "Get a Palatine Public Library District card"
        detail: "Bring one photo ID showing your current address within the District, or two forms of ID (one with a photo) if your address isn't current on either. Kids under 14 need a parent or guardian along. Non-residents can buy a full-service card for an annual fee — contact Member Services (ext. 125) to calculate it."
        url: "https://www.palatinelibrary.org/about/library-cards"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Register for Palatine Park District programs"
        detail: "Most residents set up one household account, then register for pools, rec classes, and seasonal programs individually — browse the current program guide to get started."
        url: "https://www.palatineparks.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Community Consolidated School District 15 (elementary & middle school)"
        detail: "CCSD 15 is the third-largest elementary district in Illinois, covering all or part of seven towns (Palatine, Rolling Meadows, Hoffman Estates, Inverness, South Barrington, Arlington Heights, and Schaumburg) — confirm your specific address, since boundaries cross village lines. District office: (847) 963-3000."
        url: "https://www.ccsd15.net/registration"
        tags: []
      - title: "Township High School District 211 (high school)"
        detail: "William Fremd High School is Palatine's own, one of five D211 high schools serving Hoffman Estates, Inverness, Palatine, Schaumburg, and parts of several other northwest suburbs — confirm by address rather than assuming, since D211 territory overlaps with towns like Arlington Heights that mostly belong to a different high school district."
        url: "https://adc.d211.org/"
        tags: []
