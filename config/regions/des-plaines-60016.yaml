# Region config for Des Plaines, IL (ZIP 60016) — the third region
# (ROADMAP.md item 27), picked from the shortlist item 27 recorded (Des
# Plaines, Palatine, or Elk Grove Village) because its ZIP was already
# present in templates/hub.html.j2's ZIP_COORDS table (used for the "show
# distance from me" manual-entry fallback), which meant its coordinates
# were already vetted rather than a fresh guess.
#
# Status as of 2026-08-30 (fourteenth research pass, ROADMAP.md item 63
# follow-up): the "Connection reset by peer" on City News below wasn't a
# blocked/parked path - it's the wrong domain entirely. WebSearch confirms
# the City's real site is **desplainesil.gov**, not desplaines.org (whois
# for the latter was never checked; whatever desplaines.org is/was, it
# isn't the City). Source `url` switched below to
# https://www.desplainesil.gov/Residents/News, the real news list page.
# Not yet re-verified against a live build since the switch - keeping the
# original 2026-08-29 status notes below since the library/park district
# findings are still accurate and unrelated to this domain fix.
#
# Status as of 2026-08-29 (confirmed against the real GitHub Actions build
# on main, run 33246555815, 09:54 UTC - read directly from its job log,
# not inferred from generated HTML):
#   - City News: desplaines.org/news actively **failed the connection**
#     ("Connection reset by peer"), not a 404/403 - a real signal this
#     exact host+path combination is wrong (parked domain, DNS
#     misconfiguration, or a server actively refusing the request),
#     different from Mount Prospect's 403s where the domain is right but
#     blocked. Root cause found 2026-08-30: wrong domain, see above.
#   - Library Events: desplaines.org's sibling domain dppl.org
#     **CONFIRMED to resolve** and returned 3 items, stable across three
#     builds - but they're generic nav links ("My events", "Book groups",
#     "Computer classes") from the keyword fallback, not real dated
#     events. Acted on this same session: source `url` switched to
#     `calendar.dppl.org` directly, the subdomain one of those links
#     pointed at - the same "library calendar lives on its own platform
#     subdomain" shape already confirmed for Mount Prospect
#     (mppl.libnet.info). Not yet re-verified against a live run since the
#     switch.
#   - Park District Events: dppd.org **CONFIRMED to resolve** and returned
#     1 real item, a dated "Live at the Lake" concert - but its own detail
#     link pointed to `dpparks.org/event/13491/`, matching fetchers.py's
#     default `/event/\d+` detail-link pattern exactly. Acted on this
#     same session: source `url` switched to dpparks.org/events directly
#     (see the source block below) on the bet that fetching the real
#     events listing page there surfaces more than the one item dppd.org
#     incidentally linked to. Not yet re-verified against a live run since
#     the switch - next hour's real build will show whether the guess at
#     dpparks.org's own /events path pays off.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build - if any of the three
# domains above turn out to be wrong, this region simply falls back to
# the evergreen entries below until a real link surfaces (same recovery
# path Mount Prospect's and Arlington Heights' sources went through).

region:
  id: "des-plaines-60016"
  name: "Des Plaines"
  zip: "60016"
  state: "IL"
  timezone: "America/Chicago"
  tagline: "City news, library events, and park district programs — just north of O'Hare."
  # Reused from templates/hub.html.j2's existing ZIP_COORDS table (already
  # present there for the "distance from me" nearby-ZIP fallback before
  # this region existed) rather than a fresh guess - a rough town-center
  # approximation, not a specific venue's address.
  lat: 42.0334
  lon: -87.8834
  # Optional: force the /region/ page's "Editor's Pick" card to a specific
  # item by its exact `url` (ROADMAP.md Phase 11 #16). Unset by default -
  # the heuristic (soonest dated item, ties broken by free/kid-friendly)
  # picks automatically otherwise. Uncomment and set to override:
  # editors_pick_url: "https://www.dppl.org/"

sources:
  - name: "City of Des Plaines — News"
    type: html_events
    # Fixed 2026-08-30 (see header note): the City's real domain is
    # desplainesil.gov, not desplaines.org - confirmed via WebSearch
    # against the City's own "Access Your Government" and Media Services
    # pages. Still relies on the keyword fallback rather than an invented
    # detail_link_pattern (no individual news-item URL shape confirmed
    # yet).
    url: "https://www.desplainesil.gov/Residents/News"
    keywords: ["news", "press release", "mayor", "council", "meeting", "notice", "advisory", "alert", "closure"]
    section: "City News"
    enabled: true

  - name: "Des Plaines Public Library — Events"
    type: html_events
    # Pointed at calendar.dppl.org 2026-08-29, based on real evidence: the
    # previous dppl.org/events source returned a "My events" link to
    # https://calendar.dppl.org/myevents - a distinct subdomain, the same
    # "library calendar lives on its own platform subdomain" shape
    # mppl.libnet.info (Mount Prospect) already confirmed. Root path only
    # (no confirmed listing-page path yet); still relies on the keyword
    # fallback, still html_events since no ICS/RSS export is confirmed.
    url: "https://calendar.dppl.org/"
    keywords: ["event", "class", "program", "story", "camp", "concert", "workshop", "book"]
    section: "Library Events"
    enabled: true

  - name: "Des Plaines Park District — Events"
    type: html_events
    # Pointed directly at dpparks.org 2026-08-29, based on real evidence
    # (see header note): the previous dppd.org/events source already
    # returned one real dated event whose own detail link was
    # dpparks.org/event/13491/ - matching the default detail-link pattern
    # (/event/\d+) fetchers.py already applies with no config needed. If
    # dpparks.org runs a real events listing at this path, this should
    # surface more than the one item dppd.org's page incidentally linked
    # to. Still html_events, not ics, since no calendar export URL has
    # been confirmed. Fails soft to 0 items (same as before) if this
    # guess at the listing-page path is wrong.
    url: "https://www.dpparks.org/events"
    keywords: ["event", "class", "program", "camp", "swim", "sport", "concert", "festival"]
    section: "Park District Events"
    enabled: true

evergreen:
  - title: "Des Plaines Public Library"
    detail: "Story times, programs, and museum passes for Des Plaines residents."
    url: "https://www.dppl.org/"
    tags: ["indoor", "kid_friendly", "free"]
  - title: "Des Plaines Park District"
    detail: "Parks, pools, and rec programs across the city."
    url: "https://www.dppd.org/"
    tags: ["outdoor", "kid_friendly"]
  - title: "City of Des Plaines"
    detail: "City council meetings, permits, and community announcements."
    url: "https://www.desplainesil.gov/"
    tags: []

