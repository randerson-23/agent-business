  # ROADMAP.md Phase 11 #49 (ninth research pass) built this guide hedged,
  # unsourced, and pointed at the wrong City domain; #63 (fourteenth
  # research pass, 2026-08-30) replaced it with WebSearch-sourced real
  # facts, same treatment already applied to Mount Prospect (PR #86) and
  # Arlington Heights (PR #87) - see those configs' comments for the full
  # rationale. Every fact and link below is sourced, not guessed; verify
  # against the linked page before treating a number as current.
  #
  # Real finding, not assumed: Des Plaines eliminated its vehicle sticker
  # program back in July 2020 (Journal & Topics, Patch) - earlier than
  # Mount Prospect's and Arlington Heights' 2024 eliminations, extending
  # the confirmed regional pattern to three of four regions. Also found in
  # the same research pass: the City's real domain is desplainesil.gov,
  # not desplaines.org (see the source block above) - this guide's City
  # link was silently pointing at the wrong domain the whole time.
  - slug: "new-to-town"
    title: "New to Town"
    summary: "The practical first-week checklist for anyone new to Des Plaines — utilities and refuse/recycling, a library card, Park District registration, and which school districts actually serve your address. Pulls from the same civic sources as the weekly digest, organized for someone who just moved in rather than someone browsing this week's events."
    items:
      - title: "City services, utilities, refuse & recycling"
        detail: "There's no vehicle sticker to buy — Des Plaines eliminated its program in July 2020. Trash, recycling, and yard waste are collected by the City's contracted hauler LRS; the monthly rate is set by the City each year. Water/sewer questions go to Public Works and Engineering, 1111 Joseph J. Schwab Rd., 847-391-5464."
        url: "https://www.desplainesil.gov/access-your-government/city-departments/finance-department/utility-information"
        tags: []
      - title: "Get a Des Plaines Public Library card"
        detail: "Residents of incorporated Des Plaines qualify for a free card — apply online and the card arrives by mail within about 5 days, or apply in person. Kids in 8th grade or younger need a parent or guardian along with photo ID and proof of residency."
        url: "https://www.dppl.org/patron-services/get-a-library-card"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Register for Des Plaines Park District programs"
        detail: "Register online through the district's WebTrac portal once you've set up a household account; residency is verified at registration. Non-residents can buy an annual pass (around $450/year) to register at resident rates. Registration questions: 847-391-5700."
        url: "https://www.dpparks.org/how-to-register/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Community Consolidated School District 62 (elementary & middle school)"
        detail: "CCSD 62 serves most of Des Plaines and Rosemont, feeding into Maine West High School — but pockets of the city fall under East Maine SD 63 or Elk Grove's CCSD 59 instead, so confirm your specific address rather than assuming. New-family registration runs through the Infinite Campus portal; district office: (847) 824-1159."
        url: "https://www.d62.org/enrollment/new-student-enrollment"
        tags: []
      - title: "Maine Township High School District 207 (high school)"
        detail: "Most Des Plaines addresses feed into Maine West High School, part of District 207 — check the district's attendance boundary map to confirm, since a home a few blocks over can fall into a different Maine 207 school."
        url: "https://maine207.org/attendance-boundary-map/"
        tags: []
