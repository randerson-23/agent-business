    title: "Seasonal Circuit Guide"
    summary: "The recurring seasonal happenings Des Plaines families ask about year after year — Fall Fest, Taste of Des Plaines, and Park District seasonal programming. Links to the City's own pages, where each year's exact dates actually get posted."
    items:
      - title: "City Sponsored Events — Des Plaines"
        detail: "The City's own events hub for its recurring festivals, including Fall Fest at Lake Park each fall - dates and details are announced there each year."
        url: "https://www.desplainesil.gov/access-your-government/city-departments/media-services/city-sponsored-events"
