  - slug: "new-to-town"
    title: "New to Town"
    summary: "The practical first-week checklist for anyone new to Arlington Heights — utilities and vehicle stickers, a library card, Park District registration, and where school-district boundaries actually come from. Pulls from the same civic sources as the weekly digest, organized for someone who just moved in rather than someone browsing this week's events."
    items:
      - title: "Village services, utilities & vehicle stickers"
        detail: "Water service, refuse & recycling pickup, and Village vehicle sticker requirements are typically set up directly with the Village — check current requirements and any new-resident forms on its site."
        url: "https://www.vah.com/"
        tags: []
      - title: "Get an Arlington Heights Memorial Library card"
        detail: "A free library card is one of the fastest ways to feel settled in — story times, makerspace classes, and programs for all ages once you're in the system."
        url: "https://www.ahml.info/"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Register for Arlington Heights Park District programs"
        detail: "Most residents set up one household account, then register for pools, rec classes, and seasonal programs individually — browse the current program guide to get started."
        url: "https://www.ahpd.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Find your school district"
        detail: "Illinois suburbs are typically served by separate elementary and high school districts assigned by home address, not by village boundaries — check with the specific district for your new address rather than assuming it matches a neighbor's."
        tags: []
