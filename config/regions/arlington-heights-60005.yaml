# Region config for Arlington Heights, IL (ZIP 60005) — the second region,
# added to prove the multi-region architecture generalizes (ROADMAP.md
# Phase 5). A short drive from Mount Prospect, fits the "plan a weekend
# nearby" story.
#
# Status as of 2026-08-29 (confirmed against the real GitHub Actions build
# on main, run 33246555815, 09:54 UTC - read directly from its job log,
# not inferred from generated HTML):
#   - Village News: vah.com resolves and returns 6 item(s), but they're
#     real Village links picked up by the *keyword fallback*
#     ("Village Board", "Board Meetings Online", "Boards & Commissions"),
#     not the `news_detail_T<n>_R<n>.php` detail_link_pattern below - that
#     pattern matched zero links on this run. Not broken (every link shown
#     is a real, working Village page), just less precise than "news"
#     implies; worth tightening once a real news_detail_ link is confirmed
#     live again, or the section renamed if the pattern never fires.
#   - Library Events: CONFIRMED — ahml.info returned 6 real items via the
#     detail_link_pattern below (/scheduling/reservation/<id> links, e.g.
#     "Beginning ESL", "LEGO Club").
#   - Park District Events: CONFIRMED — ahpd.org's ICS export returned 6
#     real dated events (e.g. "Touch-A-Truck" 2026-09-12, "Heritage Fest"
#     2026-09-19), each with a real ahpd.org/event/... URL.
#   - School Calendar (District 25): added 2026-08-30 (fourteenth research
#     pass, ROADMAP.md item 32 follow-up) - a real URL found via web
#     search, not yet confirmed by a live fetch. See the source block
#     below for the full rationale.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build.

region:
  id: "arlington-heights-60005"
  name: "Arlington Heights"
  zip: "60005"
  state: "IL"
  timezone: "America/Chicago"
  tagline: "Village news, library events, and park district programs — a short drive from Mount Prospect."
  # Village Hall coordinates (33 S Arlington Heights Rd) - a region-level
  # approximation for the "distance from you" feature (ROADMAP.md
  # Phase 8), not a specific venue's address.
  lat: 42.0883
  lon: -87.9806
  # Optional: force the /region/ page's "Editor's Pick" card to a specific
  # item by its exact `url` (ROADMAP.md Phase 11 #16). Unset by default -
  # the heuristic (soonest dated item, ties broken by free/kid-friendly)
  # picks automatically otherwise. Uncomment and set to override:
  # editors_pick_url: "https://www.ahml.info/"

sources:
  - name: "Village of Arlington Heights — News"
    type: html_events
    url: "https://www.vah.com/newslist.php"
    detail_link_pattern: "news_detail_T\\d+_R\\d+\\.php"
    keywords: ["news", "press release", "mayor", "board", "meeting", "notice", "advisory", "alert"]
    section: "Village News"
    enabled: true

  - name: "Arlington Heights Memorial Library — Events"
    type: html_events
    url: "https://www.ahml.info/attend/events"
    # AHML runs a Drupal calendar (Views + Calendar module). Every real
    # event's title links to its modal detail view at
    # /scheduling/reservation/<numeric id> (confirmed 2026-08-28 from a
    # copied event link and page source: an <h4 class="event_title"> with
    # <a class="use-ajax" href="/scheduling/reservation/218675">). Using
    # that as detail_link_pattern, same fix that corrected Mount
    # Prospect's library and Arlington Heights' own village news source.
    detail_link_pattern: "scheduling/reservation/\\d+"
    keywords: ["event", "class", "program", "story", "camp", "concert", "workshop", "book"]
    section: "Library Events"
    enabled: true

  - name: "Arlington Heights Park District — Events"
    type: ics
    url: "webcal://www.ahpd.org/events/?post_type=tribe_events&ical=1&eventDisplay=list"
    section: "Park District Events"
    enabled: true

  - name: "Arlington Heights School District 25 — Calendar"
    type: ics
    # ROADMAP.md Phase 11 #32 follow-up (fourteenth research pass,
    # 2026-08-30): same "school calendars as a data source" treatment
    # already confirmed working for Mount Prospect's District 57 (see
    # that config's comment). Found via web search of sd25.org's own
    # "ICal Feed" page - a real, indexed page at this exact URL, not an
    # invented pattern - and not yet confirmed by a live fetch (this
    # sandbox's own network is proxy-blocked too, same as every source
    # here). Township High School District 214 (the shared high school
    # district) was already researched for Mount Prospect and has no
    # discoverable public ICS feed, only PDF calendars - not re-checked
    # here since that finding is district-wide, not region-specific.
    url: "webcal://www.sd25.org/site/handlers/icalfeed.ashx?MIID=569"
    section: "School Calendar"
    enabled: true

evergreen:
  - title: "Arlington Heights Memorial Library"
    detail: "500 N. Dunton Ave. Makerspace classes, culinary classes, and programs for all ages."
    url: "https://www.ahml.info/"
    tags: ["indoor", "kid_friendly", "free"]
  - title: "Arlington Heights Park District"
    detail: "Parks, pools, and Lake Arlington across the village."
    url: "https://www.ahpd.org/"
    tags: ["outdoor", "kid_friendly"]
  - title: "Village of Arlington Heights"
    detail: "Village board meetings, permits, and community announcements."
    url: "https://www.vah.com/"
    tags: []

# Seasonal/evergreen guides (ROADMAP.md Phase 11 #5) - see the Mount
# Prospect config for the rationale; same civic-source-only approach here.
guides:
  - slug: "fall-family-guide"
    title: "Fall Family Guide"
    summary: "A living guide to fall in Arlington Heights — seasonal park district programs, library fall programming, and where the Village posts official trick-or-treat hours. Pulls from the same civic sources as the weekly digest, organized by season instead of by week."
    items:
      - title: "Fall & Halloween programs — Arlington Heights Park District"
        detail: "Pumpkin-themed drop-ins, fall break camps, and seasonal rec programs. Dates and registration change every year — check the current program guide."
        url: "https://www.ahpd.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Fall programs — Arlington Heights Memorial Library"
        detail: "Seasonal makerspace classes, storytimes, and programs for all ages — a solid pick for a rainy fall Saturday."
        url: "https://www.ahml.info/"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Official trick-or-treat hours & fall notices"
        detail: "The Village posts that year's official trick-or-treat hours and other fall community notices on its news page each October."
        url: "https://www.vah.com/newslist.php"
        tags: ["kid_friendly", "free"]

  # ROADMAP.md Phase 11 #15 - see the Mount Prospect config for the
  # rationale; same civic-source-only discipline here.
  - slug: "birthday-parties-and-kids-classes"
    title: "Birthday Parties & Kids' Classes"
    summary: "Where Arlington Heights families look for party venues, rec classes, and enrichment programs — the small set of standing civic options, plus local businesses as they join the directory below."
    items:
      - title: "Birthday parties & rentals — Arlington Heights Park District"
        detail: "Pool parties, gym space, and themed party packages through the Park District — check current pricing, room availability, and booking windows."
        url: "https://www.ahpd.org/"
        tags: ["kid_friendly"]
      - title: "Kids' classes & camps — Arlington Heights Park District"
        detail: "Swim lessons, sports, dance, and seasonal camps for all ages — browse the current program guide for schedules and registration."
        url: "https://www.ahpd.org/"
        tags: ["kid_friendly"]
      - title: "Kids' programs — Arlington Heights Memorial Library"
        detail: "Free storytimes, makerspace classes, and craft programs for kids and teens — no registration fee."
        url: "https://www.ahml.info/"
        tags: ["indoor", "kid_friendly", "free", "teen"]
      - title: "Local party venues, entertainers & tutoring centers"
        detail: "Private businesses appear here as they join the local directory — see what's currently listed."
        url: "https://randerson-23.github.io/agent-business/arlington-heights-60005/directory/"
        tags: ["kid_friendly"]

  # ROADMAP.md Phase 11 #49 (ninth research pass) built this guide; #63
  # (thirteenth research pass) found Mount Prospect's version had hedged
  # into near-uselessness and one flatly wrong fact - see that config's
  # comment for the full rationale. Same WebSearch-sourced treatment
  # applied here (2026-08-30): every fact and link below is sourced, not
  # guessed. Verify against the linked page before treating a number as
  # current, same as any secondhand civic information.
  #
  # Real finding, not assumed: Arlington Heights ALSO eliminated its
  # vehicle sticker program (and dog licenses) in the 2024 budget,
  # confirmed directly on the Village's own site
  # (vah.com/_T13_R289.php, "Vehicle Stickers in 2024 and Beyond No
  # Longer Required") - the same change Mount Prospect made the same
  # year, suggesting a real regional pattern worth checking before
  # writing Des Plaines' and Palatine's own guides.
  - slug: "new-to-town"
    title: "New to Town"
    summary: "The practical first-week checklist for anyone new to Arlington Heights — utilities and refuse/recycling, a library card, Park District registration, and which school districts actually serve your address. Pulls from the same civic sources as the weekly digest, organized for someone who just moved in rather than someone browsing this week's events."
    items:
      - title: "Village services, utilities, refuse & recycling"
        detail: "Water is billed by the Village every two months (Water Billing, 847-368-5520). Refuse, recycling, and yard waste go out together once a week via Groot (800-244-1977) - collection day depends which of the Village's four quadrants you're in (split by Oakton St. and Arlington Heights Rd.), so check the schedule. The vehicle sticker and dog license programs were both eliminated in the 2024 budget, so that's two less errands than older guides mention."
        url: "https://www.vah.com/residents/new_residents.php"
        tags: []
      - title: "Get an Arlington Heights Memorial Library card"
        detail: "Register online for temporary or full access, or bring a photo ID with your current address to the Checkout Desk for a full-service card. If your ID address isn't current, a recent utility bill, postmarked mail, lease, or tax bill also works. Resident cards don't expire while you live in the library district. Circulation: 847-392-0100."
        url: "https://www.ahml.info/register"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Register for Arlington Heights Park District programs"
        detail: "Most residents set up one household account, then register for pools, rec classes, and seasonal programs individually — browse the current program guide to get started."
        url: "https://www.ahpd.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Arlington Heights School District 25 (elementary & middle school)"
        detail: "7 elementary and 2 middle schools serve about 5,500 students — confirm your specific address, since school boundaries don't always follow village lines. District office: (847) 758-4900."
        url: "https://www.sd25.org/Registration"
        tags: []
      - title: "Township High School District 214 (high school)"
        detail: "John Hersey High School, Arlington Heights' own, is part of District 214 - the same district that serves Mount Prospect's Prospect High School and several other neighboring towns — confirm by address rather than assuming."
        url: "https://www.d214.org/"
        tags: []
