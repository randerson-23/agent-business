# Region config for Arlington Heights, IL (ZIP 60005) — the second region,
# added to prove the multi-region architecture generalizes (ROADMAP.md
# Phase 5). A short drive from Mount Prospect, fits the "plan a weekend
# nearby" story.
#
# Status as of 2026-08-29 (confirmed against the real GitHub Actions build
# on main, run 33246555815, 09:54 UTC - read directly from its job log,
# not inferred from generated HTML):
#   - Village News: vah.com resolves and returns 6 item(s), but they're
#     real Village links picked up by the *keyword fallback*
#     ("Village Board", "Board Meetings Online", "Boards & Commissions"),
#     not the `news_detail_T<n>_R<n>.php` detail_link_pattern below - that
#     pattern matched zero links on this run. Not broken (every link shown
#     is a real, working Village page), just less precise than "news"
#     implies; worth tightening once a real news_detail_ link is confirmed
#     live again, or the section renamed if the pattern never fires.
#   - Library Events: CONFIRMED — ahml.info returned 6 real items via the
#     detail_link_pattern below (/scheduling/reservation/<id> links, e.g.
#     "Beginning ESL", "LEGO Club").
#   - Park District Events: CONFIRMED — ahpd.org's ICS export returned 6
#     real dated events (e.g. "Touch-A-Truck" 2026-09-12, "Heritage Fest"
#     2026-09-19), each with a real ahpd.org/event/... URL.
#   - School Calendar (District 25): added 2026-08-30 (fourteenth research
#     pass, ROADMAP.md item 32 follow-up) - a real, indexed URL found via
#     web search, but CONFIRMED BROKEN against the real GitHub Actions
#     build 2026-09-15 (run 34983302071): "404 Client Error: Not Found".
#     Same URL two independent WebSearch passes both surfaced, and the
#     page that URL sits on (sd25.org's own "ICal Feed" page) is real -
#     the module instance ID (MIID=569) itself has apparently rotated or
#     expired server-side since being indexed, a failure mode this
#     research technique can't detect ahead of a live fetch. Left enabled
#     (fails soft to 0 either way) rather than disabled; a fresh MIID
#     would need a real page fetch to find, which this sandbox can't do
#     and WebSearch keeps returning the same stale one. See the source block
#     below for the full rationale.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build.

region:
  id: "arlington-heights-60005"
  name: "Arlington Heights"
  zip: "60005"
  state: "IL"
  timezone: "America/Chicago"
  # ROADMAP.md Phase 11 #116: named real venues (Harmony Park hosts
  # Harmony Fest & Taste of Arlington Heights below; Lake Arlington is
  # the Park District's own named lake), not a generic sentence naming
  # no place - see the mount-prospect config's own comment on this
  # item for the full rationale. Rewritten for item 126 (twenty-ninth
  # pass) to lead with "Pulled automatically" - see that same comment.
  tagline: "Pulled automatically from the Village, Memorial Library, and Park District — plus Harmony Park and Lake Arlington — several times a week, a short drive from Mount Prospect."
  # Village Hall coordinates (33 S Arlington Heights Rd) - a region-level
  # approximation for the "distance from you" feature (ROADMAP.md
  # Phase 8), not a specific venue's address.
  lat: 42.0883
  lon: -87.9806
  # Optional: force the /region/ page's "Editor's Pick" card to a specific
  # item by its exact `url` (ROADMAP.md Phase 11 #16). Unset by default -
  # the heuristic (soonest dated item, ties broken by free/kid-friendly)
  # picks automatically otherwise. Uncomment and set to override:
  # editors_pick_url: "https://www.ahml.info/"

sources:
  - name: "Village of Arlington Heights — News"
    type: html_events
    url: "https://www.vah.com/newslist.php"
    detail_link_pattern: "news_detail_T\\d+_R\\d+\\.php"
    keywords: ["news", "press release", "mayor", "board", "meeting", "notice", "advisory", "alert"]
    section: "Village News"
    enabled: true

  - name: "Arlington Heights Memorial Library — Events"
    type: html_events
    url: "https://www.ahml.info/attend/events"
    # AHML runs a Drupal calendar (Views + Calendar module). Every real
    # event's title links to its modal detail view at
    # /scheduling/reservation/<numeric id> (confirmed 2026-08-28 from a
    # copied event link and page source: an <h4 class="event_title"> with
    # <a class="use-ajax" href="/scheduling/reservation/218675">). Using
    # that as detail_link_pattern, same fix that corrected Mount
    # Prospect's library and Arlington Heights' own village news source.
    detail_link_pattern: "scheduling/reservation/\\d+"
    keywords: ["event", "class", "program", "story", "camp", "concert", "workshop", "book"]
    section: "Library Events"
    enabled: true

  - name: "Arlington Heights Park District — Events"
    type: ics
    url: "webcal://www.ahpd.org/events/?post_type=tribe_events&ical=1&eventDisplay=list"
    section: "Park District Events"
    enabled: true

  - name: "Arlington Heights School District 25 — Calendar"
    type: ics
    # ROADMAP.md Phase 11 #32 follow-up (fourteenth research pass,
    # 2026-08-30): same "school calendars as a data source" treatment
    # already confirmed working for Mount Prospect's District 57 (see
    # that config's comment). Found via web search of sd25.org's own
    # "ICal Feed" page - a real, indexed page at this exact URL, not an
    # invented pattern. CONFIRMED BROKEN 2026-09-15 against the real
    # build (run 34983302071): 404. See the header comment above for the
    # full finding - a real, indexed URL isn't the same as a live one,
    # and this sandbox's blocked network can't tell the difference ahead
    # of a real fetch. Left enabled since it fails soft regardless.
    # Township High School District 214 (the shared high school
    # district) was already researched for Mount Prospect and has no
    # discoverable public ICS feed, only PDF calendars - not re-checked
    # here since that finding is district-wide, not region-specific.
    url: "webcal://www.sd25.org/site/handlers/icalfeed.ashx?MIID=569"
    section: "School Calendar"
    enabled: true

# Known, dated, recurring annual events (ROADMAP.md Phase 11 #67/#68) -
# see the Mount Prospect config for the full rationale (a near-miss where
# a marquee event was invisible on the site three days before it
# happened). Confirmed via WebSearch 2026-09-15: Downtown Arlington
# Heights' own Harmony Fest & Taste of Arlington Heights, its biggest
# fall festival, runs Fri-Sat, Oct 2-3, 2026, in Harmony Park - one entry
# per day since Friday and Saturday have different hours. Not yet
# confirmed by a live fetch of the linked page's exact hours.
annual_events:
  - title: "Harmony Fest & Taste of Arlington Heights (Friday)"
    date: "2026-10-02"
    detail: "Free live concerts in Harmony Park plus food & drink from local restaurants. 5–11pm, Downtown Arlington Heights."
    url: "https://downtownarlingtonheights.us/events/harmony-fest-taste-of-arlington-heights-2026"
    tags: ["free", "outdoor"]
  - title: "Harmony Fest & Taste of Arlington Heights (Saturday)"
    date: "2026-10-03"
    detail: "Free live concerts, food & drink, plus a kids' zone. 3–11pm, Downtown Arlington Heights."
    url: "https://downtownarlingtonheights.us/events/harmony-fest-taste-of-arlington-heights-2026"
    tags: ["free", "kid_friendly", "outdoor"]

