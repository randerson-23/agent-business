# Shadow candidate for town six (ROADMAP.md item 416). NOT published: the build reads this file only to
# count what its sources would add (data/candidate_regions.json). Rename it without the leading
# underscore (and add the full region config) to go live.
# Library feed confirmed by the round-24 probe (200, RSS, 74 KB). No Rolling Meadows park district calendar was found.
region:
  id: "rolling-meadows-60008"
  name: "Rolling Meadows"
  zip: "60008"
  state: "IL"
  timezone: "America/Chicago"
  tagline: "Shadow candidate - not published."
  lat: 42.0842
  lon: -88.0131

sources:
  - name: "Rolling Meadows Library - Events"
    type: rss
    default_tags: ["indoor"]
    veto_tags: ["outdoor"]
    url: "https://rmlib.libnet.info/feeds?data=eyJmZWVkVHlwZSI6InJzcyIsImZpbHRlcnMiOnsibG9jYXRpb24iOlsiYWxsIl0sImFnZXMiOlsiYWxsIl0sInR5cGVzIjpbImFsbCJdLCJ0YWdzIjpbXSwidGVybSI6IiIsImRheXMiOjMwfX0="
    section: "Library Events"
    venue_name: "Rolling Meadows Library"
    enabled: true

  # Round 25 (item 422), 2026-10-31: rmparks.org is a plain CMS with event pages at
  # /district-calendar/events/<slug> (200 from a runner); cityrm.org is CivicEngage like
  # Palatine and Wheeling (calendar.aspx 200), so the same iCal export path is tried
  # with the Main Calendar id 14 - NOT yet confirmed (round 26 probes it).
  - name: "Rolling Meadows Park District - Events"
    type: html_events
    url: "https://rmparks.org/district-calendar"
    detail_link_pattern: "/district-calendar/events/"
    section: "Park District Events"
    enabled: true

  - name: "City of Rolling Meadows - Calendar"
    type: ics
    url: "https://www.cityrm.org/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar"
    section: "City Calendar"
