# Region config for Mount Prospect, IL (ZIP 60056).
#
# Every file in config/regions/ is loaded and rendered independently by
# scripts/build_digest.py, then listed together on the hub page — this is
# the template for adding more ZIP codes later (see ROADMAP.md Phase 5).
#
# Status as of 2026-08-28 (see live output on main):
#   - Village News:         Switched from a guessed RSS URL (never found -
#     the CivicPlus "list all RSS feed" page doesn't expose a plain link,
#     it needs a category picked first) to scraping the real news listing
#     page directly, same approach as the library. Not yet confirmed
#     against a live run.
#   - Village Events:       New 2026-08-28. The footer RSS icon isn't a
#     real public feed, so this scrapes the Calendar page directly with a
#     confirmed detail_link_pattern. Not yet confirmed against a live run.
#   - Library Events:       Switched 2026-08-28 to the library's real RSS
#     feed (found by the site owner) instead of HTML scraping. Not yet
#     confirmed against a live run.
#   - Park District Events: URL corrected to the real Tribe Events ICS
#     export; webcal:// scheme now handled by fetchers.py. Not yet
#     confirmed against a live run since the fix.
#   - Tourism Site / Downtown Events: Added 2026-08-29 (ROADMAP.md item
#     41) — experiencemountprospect.org (the Village's own tourism site)
#     and mpdowntown.com (the downtown merchants association, already
#     linked from the seasonal-circuit guide) as two more live sources.
#     URLs are a best guess at each site's events listing page, not yet
#     confirmed against a live run — same starting point every other
#     source here began from. No detail_link_pattern set until a real
#     one is confirmed; falls back to keyword-filtered link scraping,
#     same as any other unconfirmed html_events source. Fails soft to
#     the evergreen fallback if either guess is wrong.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build.

region:
  id: "mount-prospect-60056"
  name: "Mount Prospect"
  zip: "60056"
  state: "IL"
  timezone: "America/Chicago"
  tagline: "Village news, library events, and park district programs."
  # Village Hall coordinates (50 S Emerson St) - a region-level
  # approximation for the "distance from you" feature (ROADMAP.md
  # Phase 8), not a specific venue's address.
  lat: 42.0666
  lon: -87.9373
  # Optional: force the /region/ page's "Editor's Pick" card to a specific
  # item by its exact `url` (ROADMAP.md Phase 11 #16). Unset by default -
  # the heuristic (soonest dated item, ties broken by free/kid-friendly)
  # picks automatically otherwise. Uncomment and set to override:
  # editors_pick_url: "https://mppl.org/"

sources:
  - name: "Village of Mount Prospect — News"
    type: html_events
    url: "https://www.mountprospect.org/services/news"
    # Tuned for news-listing link text instead of the events default.
    keywords: ["news", "board", "meeting", "closure", "closed", "notice", "advisory", "alert", "update"]
    section: "Village News"
    enabled: true

  - name: "Village of Mount Prospect — Calendar"
    type: html_events
    # The site's footer RSS icon isn't a real public feed (it's tied to the
    # eNotification subscription system, not a plain URL) - this scrapes
    # the actual Calendar page instead. Confirmed 2026-08-28 from a real
    # event link and page source the owner supplied: the Village runs a
    # Vision Internet-style CMS where every calendar event links to
    # /Home/Components/Calendar/Event/<event id>/<section navid>, e.g.
    # /Home/Components/Calendar/Event/27357/1044 (1044 = the Calendar
    # section's own navid, confirmed against the site's nav menu markup).
    url: "https://www.mountprospect.org/services/calendar"
    detail_link_pattern: "Home/Components/Calendar/Event/\\d+/\\d+"
    section: "Village Events"
    enabled: true

  - name: "Mount Prospect Public Library — Events"
    type: rss
    # mppl.org/events/ is a marketing page with only nav links (no real
    # events), so this was previously scraped as html_events from
    # mppl.libnet.info/events. Switched 2026-08-28 to the library's actual
    # RSS export (Communico "feeds" endpoint) - a structured feed is more
    # reliable than HTML scraping when one's available.
    #
    # The `data` param is base64 of a plain JSON filters object, e.g.
    # {"feedType":"rss","filters":{"location":["all"],"ages":["all"],
    # "types":["all"],"tags":[],"term":"","days":30}} - readable and
    # re-encodable, not a signed/opaque token. The link as first found had
    # "days":1 (today only), which would leave this section empty most
    # days on a weekly digest; widened to "days":30 here so it actually
    # covers a useful window, matching the unbounded-then-capped-at-6
    # behavior of the other sources. Not yet confirmed against a live run
    # (this sandbox can't reach mppl.libnet.info); will be verified by the
    # next real build in CI/deploy, which has real network access.
    url: "https://mppl.libnet.info/feeds?data=eyJmZWVkVHlwZSI6InJzcyIsImZpbHRlcnMiOnsibG9jYXRpb24iOlsiYWxsIl0sImFnZXMiOlsiYWxsIl0sInR5cGVzIjpbImFsbCJdLCJ0YWdzIjpbXSwidGVybSI6IiIsImRheXMiOjMwfX0="
    section: "Library Events"
    enabled: true

  - name: "Mount Prospect Park District — Events"
    type: ics
    url: "webcal://www.mppd.org/?post_type=tribe_events&ical=1&eventDisplay=list"
    section: "Park District Events"
    enabled: true

  - name: "Experience Mount Prospect — Events"
    type: html_events
    # The Village's own tourism site. URL is a best guess at its events
    # listing page (unconfirmed - see header note); no detail_link_pattern
    # yet, so this relies on the keyword fallback until a real link
    # structure is confirmed the way the other sources' were.
    url: "https://www.experiencemountprospect.org/events/"
    keywords: ["event", "festival", "concert", "market", "tour", "shop", "dine", "things to do"]
    section: "Things To Do"
    enabled: true

  - name: "Downtown Mount Prospect — Events"
    type: html_events
    # The downtown merchants association (already linked as a plain URL
    # from the Seasonal Circuit Guide). Same unconfirmed-URL caveat as
    # above.
    url: "https://mpdowntown.com/events/"
    keywords: ["event", "festival", "concert", "market", "sale", "sidewalk", "oktoberfest"]
    section: "Downtown Events"
    enabled: true

# Evergreen, always-available local info used as a fallback so the digest
# never ships empty even if every live source above fails to fetch.
evergreen:
  - title: "Mount Prospect Public Library"
    detail: "125 S Emerson St. Story times, teen programs, and free museum passes."
    url: "https://mppl.org/"
    tags: ["indoor", "kid_friendly", "free"]
  - title: "Mount Prospect Park District"
    detail: "Rec programs, pools, and parks across the village."
    url: "https://www.mppd.org/"
    tags: ["outdoor", "kid_friendly"]
  - title: "Village of Mount Prospect"
    detail: "Village board meetings, permits, and community announcements."
    url: "https://www.mountprospect.org/"
    tags: []

# Seasonal/evergreen guides (ROADMAP.md Phase 11 #5) - grouped, linkable
# pages that don't expire every Monday the way a dated event listing does.
# Sourced from the same civic feeds as the weekly digest, not invented
# venue-specific claims (no fabricated hours/dates - those change yearly
# and belong on the official page, which is what these link to).
guides:
  - slug: "fall-family-guide"
    title: "Fall Family Guide"
    summary: "A living guide to fall in Mount Prospect — seasonal park district programs, library fall programming, and where the Village posts official trick-or-treat hours. Pulls from the same civic sources as the weekly digest, organized by season instead of by week."
    items:
      - title: "Fall & Halloween programs — Mount Prospect Park District"
        detail: "Pumpkin-themed drop-ins, fall break camps, and seasonal rec programs. Dates and registration change every year — check the current program guide."
        url: "https://www.mppd.org/"
        tags: ["outdoor", "kid_friendly"]
      - title: "Fall storytimes & programs — Mount Prospect Public Library"
        detail: "Seasonal storytimes, teen fall programs, and free museum passes — a solid pick for a rainy fall Saturday."
        url: "https://mppl.org/"
        tags: ["indoor", "kid_friendly", "free"]
      - title: "Official trick-or-treat hours & fall notices"
        detail: "The Village posts that year's official trick-or-treat hours and other fall community notices on its news page each October."
        url: "https://www.mountprospect.org/services/news"
        tags: ["kid_friendly", "free"]

  # ROADMAP.md Phase 11 #15 - highest commercial-intent evergreen query
  # for a family-dense ZIP. Same civic-source-only discipline as the fall
  # guide above: park district rentals/classes and library programs are
  # real, standing services, not invented specifics (no made-up prices,
  # times, or private venue names - a family finds those on the linked
  # page, where they're actually kept current). The directory link is the
  # real answer for private party venues/entertainers/tutoring centers -
  # it starts empty (see config/sponsors.yaml) and fills in as local
  # businesses actually sign up, which is more honest than guessing names.
  - slug: "birthday-parties-and-kids-classes"
    title: "Birthday Parties & Kids' Classes"
    summary: "Where Mount Prospect families look for party venues, rec classes, and enrichment programs — the small set of standing civic options, plus local businesses as they join the directory below."
    items:
      - title: "Birthday parties & rentals — Mount Prospect Park District"
        detail: "Pool parties, gym space, and themed party packages through the Park District — check current pricing, room availability, and booking windows."
        url: "https://www.mppd.org/"
        tags: ["kid_friendly"]
      - title: "Kids' classes & camps — Mount Prospect Park District"
        detail: "Swim lessons, sports, dance, and seasonal camps for all ages — browse the current program guide for schedules and registration."
        url: "https://www.mppd.org/"
        tags: ["kid_friendly"]
      - title: "Kids' programs — Mount Prospect Public Library"
        detail: "Free storytimes, STEM programs, and craft classes for kids and teens — no registration fee."
        url: "https://mppl.org/"
        tags: ["indoor", "kid_friendly", "free", "teen"]
      - title: "Local party venues, entertainers & tutoring centers"
        detail: "Private businesses appear here as they join the local directory — see what's currently listed."
        url: "https://randerson-23.github.io/agent-business/mount-prospect-60056/directory/"
        tags: ["kid_friendly"]

  # ROADMAP.md Phase 11 #42 - the recurring seasonal happenings families
  # ask about year after year. Same discipline as the guides above: no
  # invented dates (a wrong specific date is worse than no date), just
  # real, standing pages where that year's actual schedule lives.
  - slug: "seasonal-circuit-guide"
    title: "Seasonal Circuit Guide"
    summary: "The recurring seasonal happenings Mount Prospect families ask about year after year — the downtown fall festival, farmers market season, and Park District seasonal programming. Links to the real organizers' own pages, where each year's exact dates actually get posted."
    items:
      - title: "Downtown Mount Prospect Oktoberfest & Fall Festival"
        detail: "Downtown Mount Prospect's annual fall festival, hosted by the Downtown Merchants — dates and details are announced on their own site each year."
        url: "https://mpdowntown.com/"
        tags: ["outdoor"]
      - title: "Village-run seasonal events & farmers market"
        detail: "The Village's calendar posts each year's seasonal community events, including the downtown farmers market when it's in season — check for the current schedule."
        url: "https://www.mountprospect.org/services/calendar"
        tags: ["outdoor", "free"]
      - title: "Seasonal programs — Mount Prospect Park District"
        detail: "The Park District runs its own seasonal programming and community events year-round — browse the current program guide for what's on."
        url: "https://www.mppd.org/"
        tags: ["outdoor", "kid_friendly"]
