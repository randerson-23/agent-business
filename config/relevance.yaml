# Which events lead a town's short list (ROADMAP.md item 268). This only
# REORDERS: an adult event still appears on its town's page and under "see
# everything". It decides which entries make the email's per-town cap and
# which of two events at the same time comes first on the weekend hub.
#
# A wrong call is a one-line fix here, no code change.

# Tags (config of tagging.py) that make an event more likely to suit a family
# looking at a weekend page. Each match adds one point.
boost_tags:
  - kid_friendly
  - free
  - outdoor

# Words in an event's title that mark an adult-programme event on a page whose
# audience is families. Each match subtracts two points. Matched whole-word,
# case-insensitively.
adult_title_keywords:
  - court
  - arbitration
  - legal
  - medicare
  - tax
  - taxes
  - retirement
  - resume
  - résumé
  - investing
  - esl
  - adults only
  - senior
  - seniors

# ROADMAP.md item 361: party and campaign meetings are left out of every list;
# civic information (voting, forums, registration) stays. Matched whole-word,
# case-insensitively, on title and description. An event that also matches a
# `keep_civic` phrase is kept (a library candidate forum may name both
# parties). Each exclusion is logged with its source, so a wrong call is a
# one-line fix here.
exclude_partisan:
  - democratic party
  - democrats
  - republican party
  - republicans
  - gop
  - libertarian party
  - green party
  - indivisible
  - progressive dems
  - young republicans
  - young democrats
  - turning point

keep_civic:
  - early voting
  - election day
  - polling place
  - polling location
  - voter registration
  - register to vote
  - league of women voters
  - candidate forum
  - candidates forum
