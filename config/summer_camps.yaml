# `last_year` (with `last_year_source`) is shown only when sourced.
#
#   arlington-heights-60005:
#     agency: "Arlington Heights Park District"
#     camp_url: "https://..."            # optional; else camp_catalogues
#     resident_opens: 2027-02-01         # optional, needs confirmed_via
#     nonresident_opens: 2027-02-15      # optional, needs confirmed_via
#     confirmed_via: "probe, 2027-01-05 (ahpd.org winter/spring guide)"
#     last_year: "March"                 # optional, needs last_year_source
#     last_year_source: "https://..."
season: 2027
towns: {}
