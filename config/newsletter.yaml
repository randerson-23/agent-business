# Email capture (ROADMAP.md Phase 11 #12) - a Buttondown (buttondown.com)
# free-tier embed. Buttondown needs a real, human-created account; this
# repo can't sign up for one on its own, so this file shipped
# unconfigured - the site showed an honest "coming soon" message rather
# than a form that posted to nothing. **Configured 2026-09-16**: the live
# signup form is now active on the hub and every region page.
#
# Note this only captures addresses. *Sending* is a separate job (items
# 24/31/36/37) and needs SPF/DKIM/DMARC on withintenmiles.com first
# (item 47) - a brand-new domain has no sending reputation, so the
# sixteenth pass's finding applies: send early and small rather than
# accumulating a list and blasting it.
#
# headline/detail are shown either way (with or without a working form),
# so they're worth keeping accurate regardless of signup status.

buttondown_username: "andersonryant"
headline: "Get it in your inbox"
# ROADMAP.md Phase 11 #108: this used to say "the weekly digest", singular,
# which was a promise the signup form couldn't keep once item 105 made
# every send the combined, all-four-towns issue - Buttondown's free plan
# has no per-region segmentation, so there's no way to detect which town a
# given subscriber is in and put it first. The fix is to say what actually
# ships: one email, one fixed order (same as load_regions()'s alphabetical
# sort in scripts/build_digest.py), named plainly instead of implied.
detail: "One email, Thursday mornings, covering Arlington Heights, Des Plaines, Mount Prospect, and Palatine. No spam, unsubscribe anytime."

# Automated weekly send (ROADMAP.md Phase 11 #24/#31), added 2026-09-17 at
# the owner's request. scripts/send_newsletter.py reads the already-built
# docs/<region>/email-send.html and creates the email in Buttondown; the
# GitHub Actions workflow send-newsletter.yml runs it on a Wednesday-night
# cron (see that file's own comment for why it isn't Thursday morning).
#
# mode: "draft" creates the email in Buttondown and stops, leaving the
# send as a human click. "send" mails it immediately. "schedule" creates
# it with a future `publish_date` and lets Buttondown itself hold and
# deliver it at the researched Thursday-07:00-Central slot.
#
# Set to "send" on 2026-09-17 at the owner's explicit instruction, then to
# "schedule" the same day once item 110's research made that setting
# actively wrong: this repo's own build-digest.yml cron history showed
# GitHub Actions scheduled runs firing 5h27m-6h54m late, three times out
# of three measured, and send-newsletter.yml's cron is exactly as
# exposed. "send" mode mails the instant the (possibly hours-late) job
# runs, so the researched Thursday-morning slot was never actually being
# honored - "schedule" fixes that by making Buttondown, not GitHub's
# cron, responsible for the actual delivery moment. The single-subscriber
# reasoning that justified skipping "draft" still applies here (mode
# controls *when*, not *whether*, so nothing about that risk changed) -
# revisit before the list grows past the owner, same as before.
#
# region: Buttondown's free plan is one list, so it can't send four
# separate region-specific emails - it sends whichever one file
# scripts/send_newsletter.py is told to read. Was "mount-prospect-60056"
# only, which meant a subscriber from any other region's signup form got
# the wrong town's weekend - a real defect, not a hypothetical one, the
# moment the list has anyone on it besides the owner. Set to "combined"
# on 2026-09-17 once that template shipped (ROADMAP.md item 105):
# docs/combined-email-send.html carries a short block per region, so
# every subscriber finds their own town in the same issue.
send:
  enabled: true
  region: "combined"
  mode: "schedule"
