# Email capture (ROADMAP.md Phase 11 #12) - a Buttondown (buttondown.com)
# free-tier embed. Buttondown needs a real, human-created account; this
# repo can't sign up for one on its own, so this file shipped
# unconfigured - the site showed an honest "coming soon" message rather
# than a form that posted to nothing. **Configured 2026-09-16**: the live
# signup form is now active on the hub and every region page.
#
# Note this only captures addresses. *Sending* is a separate job (items
# 24/31/36/37) and needs SPF/DKIM/DMARC on withintenmiles.com first
# (item 47) - a brand-new domain has no sending reputation, so the
# sixteenth pass's finding applies: send early and small rather than
# accumulating a list and blasting it.
#
# headline/detail are shown either way (with or without a working form),
# so they're worth keeping accurate regardless of signup status.

buttondown_username: "andersonryant"
headline: "Get it in your inbox"
detail: "The weekly digest, emailed once a week. No spam, unsubscribe anytime."

# Automated weekly send (ROADMAP.md Phase 11 #24/#31), added 2026-09-17 at
# the owner's request. scripts/send_newsletter.py reads the already-built
# docs/<region>/email-send.html and creates the email in Buttondown; the
# GitHub Actions workflow send-newsletter.yml runs it on a Thursday cron.
#
# mode: "draft" creates the email in Buttondown and stops, leaving the
# send as a human click. "send" mails it to the list immediately.
#
# Set to "send" on 2026-09-17 at the owner's explicit instruction. This
# shipped on "draft" the same day, on the reasoning that an email cannot
# be unsent and the pipeline had just shipped a wrong subject line (item
# 90). The owner overrode it with a better fact than the caution was
# built on: he is currently the only subscriber, so the blast radius of
# a bad issue is his own inbox, and a live weekly send is worth more as
# a real test than a draft nobody is judging. That reasoning stops
# holding the moment the list has anyone else on it - the press pitch
# (item 77) or the barter play (item 94) could do that in a day - so
# revisit this before either goes out, not after.
#
# region: Buttondown's free plan is one list, so one region's digest goes
# out. Mount Prospect is the home region and has the most sources. A
# genuine multi-region email needs a combined template that does not
# exist yet (see ROADMAP.md item 105).
send:
  enabled: true
  region: "mount-prospect-60056"
  mode: "send"
