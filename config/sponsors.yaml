# Sponsor rotation, keyed by region id (must match a `region.id` in
# config/regions/*.yaml). See BUSINESS_PLAN.md / SPONSOR_KIT.md for pricing
# background, or the live /sponsor/ page (built from SPONSOR_TIERS in
# scripts/build_digest.py) for the version a sponsor actually sees.
#
# For each region: `active` marks the entry (by id) to feature in the next
# build; leave everything else as history. `active: none` shows the
# region's own house_ad if set, otherwise default_house_ad below — the
# pipeline always has something reasonable to render.
#
# default_house_ad.url below should track SITE_BASE_URL in
# scripts/build_digest.py - update both together once a real domain is
# registered (ROADMAP.md Phase 9).
#
# Business directory (ROADMAP.md Phase 11 #6): a history entry with
# `directory: true` gets a permanent listing on that region's
# /directory/ page, even after its sponsored slot ends - this permanent
# listing is one of the core Annual Partner / Neighborhood Authority
# membership benefits (Phase 11 #29), not just a footer logo.
# Optional `category` (e.g. "Restaurant") is prefixed onto the listing's
# detail text. Set `directory: true` the first time a real business signs
# up for any tier and wants to stay listed.
#
# Recommendation framing (ROADMAP.md Phase 11 #18): a history entry that
# is the region's `active` sponsor renders with "Local Recommendation"
# framing instead of ad-unit language, plus its optional one-line `why`
# ("why we recommend you") shown above `detail`. The house ad (unset
# `active`) never gets this framing - only a real paying sponsor.
#
# Mini-interview spotlight (ROADMAP.md Phase 11 #82): an optional
# `spotlight` dict on a history entry, shown in the weekly email (once
# items 24/31 ship) as a short "in their own words" feature - the
# highest-value newsletter content and the sponsor monetization become
# the same block, per the eighteenth research pass. Three fixed
# questions the owner emails the business once (see OUTREACH_TEMPLATES.md
# §3), answered in their own words - the answers ARE the content, so
# there's nothing to write:
#   spotlight:
#     years_in_town: "how long they've been here, in their words"
#     regulars_pick: "the thing regulars order/ask for"
#     hidden_gem: "something most people don't know about them"
# All three optional - render only the ones actually answered. Never
# fabricate a business's answer to fill an empty field.

# ROADMAP.md Phase 11 #57: the /sponsor page's only conversion point
# ("Open a sponsor inquiry") used to hardcode a link to a GitHub "New
# issue" form - to buy a $1,200-5,000/year placement, a real local
# business owner had to create a GitHub account and file an issue in a
# developer bug tracker. Set this to a real inbox to switch the CTA to a
# mailto: with the same prefilled fields (see build_sponsor_cta_url() in
# scripts/build_digest.py). Set 2026-09-16 at Ryan's explicit request,
# after being left unset deliberately - this is his own contact address,
# not something the build loop should guess or invent.
#
# Stated as "for now": this is a personal Gmail published on a public
# page, so it will be scraped. Swapping it for a forwarded
# hello@withintenmiles.com (Cloudflare Email Routing, free) is a one-line
# change here once that is set up - no other code touches this value.
contact_email: "andersonryant@gmail.com"

default_house_ad:
  title: "Sponsor this spot"
  detail: "Reach local families every week. Local businesses only — see pricing and availability."
  url: "https://withintenmiles.com/sponsor/"

regions:
  mount-prospect-60056:
    active: none
    house_ad: null
    history: []
  arlington-heights-60005:
    active: none
    house_ad: null
    history: []
  des-plaines-60016:
    active: none
    house_ad: null
    history: []
  palatine-60067:
    active: none
