# Sponsor rotation, keyed by region id (must match a `region.id` in
# config/regions/*.yaml). See BUSINESS_PLAN.md / SPONSOR_KIT.md for pricing.
#
# For each region: `active` marks the entry (by id) to feature in the next
# build; leave everything else as history. `active: none` shows the
# region's own house_ad if set, otherwise default_house_ad below — the
# pipeline always has something reasonable to render.

default_house_ad:
  title: "Sponsor this spot"
  detail: "Reach local families every week. Local businesses only — see SPONSOR_KIT.md."
  url: "https://github.com/randerson-23/agent-business/blob/main/SPONSOR_KIT.md"

regions:
  mount-prospect-60056:
    active: none
    house_ad: null
    history: []
