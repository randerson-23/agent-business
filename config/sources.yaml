# Public data sources for the 60056 Weekly digest.
#
# Status as of 2026-08-26 (see live output at docs/index.html on main):
#   - Village News:         Switched from a guessed RSS URL (never found -
#     the CivicPlus "list all RSS feed" page doesn't expose a plain link,
#     it needs a category picked first) to scraping the real news listing
#     page directly, same approach as the library. Not yet confirmed
#     against a live run.
#   - Library Events:       VERIFIED working - see comment below.
#   - Park District Events: URL corrected to the real Tribe Events ICS
#     export; webcal:// scheme now handled by fetchers.py. Not yet
#     confirmed against a live run since the fix.
#
# The pipeline fails soft either way: a broken source is skipped and
# logged, it never breaks the whole digest build.

sources:
  - name: "Village of Mount Prospect — News"
    type: html_events
    url: "https://www.mountprospect.org/services/news"
    # Tuned for news-listing link text instead of the events default.
    keywords: ["news", "board", "meeting", "closure", "closed", "notice", "advisory", "alert", "update"]
    section: "Village News"
    enabled: true

  - name: "Mount Prospect Public Library — Events"
    type: html_events
    # mppl.org/events/ is a marketing page with only nav links (no real
    # events). The library's actual event listing runs on Communico at
    # mppl.libnet.info, where each event links to /event/<id> - fetchers.py
    # prefers those links when present. Confirmed 2026-08-26.
    url: "https://mppl.libnet.info/events"
    section: "Library Events"
    enabled: true

  - name: "Mount Prospect Park District — Events"
    type: ics
    url: "webcal://www.mppd.org/?post_type=tribe_events&ical=1&eventDisplay=list"
    section: "Park District Events"
    enabled: true

# Evergreen, always-available local info used as a fallback so the digest
# never ships empty even if every live source above fails to fetch.
evergreen:
  - title: "Mount Prospect Public Library"
    detail: "125 S Emerson St. Story times, teen programs, and free museum passes."
    url: "https://mppl.org/"
  - title: "Mount Prospect Park District"
    detail: "Rec programs, pools, and parks across the village."
    url: "https://www.mppd.org/"
  - title: "Village of Mount Prospect"
    detail: "Village board meetings, permits, and community announcements."
    url: "https://www.mountprospect.org/"
