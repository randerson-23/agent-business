# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Round 4 (2026-10-01). Round 3 fingerprinted each platform: DPPL's
  # calendar is Communico (meta apiserver api.communico.co, assets on
  # cdn.libnet.info) - the same platform as the Mount Prospect and Indian
  # Trails library feeds already in config - and all three school districts
  # run Finalsite.

  # Items 182/213, Des Plaines. Communico's RSS endpoint with the exact
  # generic filter blob the two working libnet feeds use (all locations,
  # ages and types, 30 days). Two candidate hosts: the custom domain, and
  # the libnet.info default (a guess at the subdomain).
  - url: https://calendar.dppl.org/feeds?data=eyJmZWVkVHlwZSI6InJzcyIsImZpbHRlcnMiOnsibG9jYXRpb24iOlsiYWxsIl0sImFnZXMiOlsiYWxsIl0sInR5cGVzIjpbImFsbCJdLCJ0YWdzIjpbXSwidGVybSI6IiIsImRheXMiOjMwfX0=
    item: 182
    purpose: Des Plaines library - Communico RSS feed on the custom domain (candidate source)
    patterns: &rss_items
      - '<item>'
      - '<title>[^<]{1,90}'
  - url: https://dppl.libnet.info/feeds?data=eyJmZWVkVHlwZSI6InJzcyIsImZpbHRlcnMiOnsibG9jYXRpb24iOlsiYWxsIl0sImFnZXMiOlsiYWxsIl0sInR5cGVzIjpbImFsbCJdLCJ0YWdzIjpbXSwidGVybSI6IiIsImRheXMiOjMwfX0=
    item: 182
    purpose: Des Plaines library - Communico RSS feed on the libnet.info host (guessed subdomain)
    patterns: *rss_items

  # Items 182/213, Palatine. Round 3's only fingerprint was a BiblioCommons
  # *catalog* link, which says nothing about the events platform.
  - url: https://www.palatinelibrary.org/events/upcoming
    item: 182
    purpose: Palatine library events - CMS and events-module fingerprint, any feed/export path
    patterns:
      - '(?i)\bdrupal\b[^"<]{0,40}'
      - '(?i)(?:librarymarket|library market|lc-calendar|lc_calendar|libraryaware|evanced|tockify|assabet|localist|trumba|wordpress|tribe-events)'
      - '(?i)[^"''\s<=]*/events?/(?:feed|rss|ical|ics|export|subscribe)[^"''\s<]*'
      - '(?i)<meta name="generator" content="[^"]*"'

  # Item 198: all three districts run Finalsite, whose calendars subscribe
  # via /fs/calendar-manager/events.ics?calendar_ids[]=N. Find the IDs.
  - url: https://www.sd25.org/calendar-73
    item: 198
    purpose: D25 calendar page - Finalsite calendar IDs for events.ics
    patterns: &finalsite_ids
      - '(?i)data-calendar[-_]?ids?="[^"]*"'
      - '(?i)calendar_ids?(?:%5B%5D|\[\])?=\d+'
      - '(?i)fs/calendar-manager/[^"''\s<]*'
      - '(?i)fs-?calendar[^"<]{0,60}'
  - url: https://www.ccsd15.net/our-district/calendars
    item: 198
    purpose: CCSD 15 calendars page - Finalsite calendar IDs for events.ics
    patterns: *finalsite_ids
  - url: https://adc.d211.org/district-info/info/calendars
    item: 198
    purpose: D211 calendars page - Finalsite calendar IDs for events.ics
    patterns: *finalsite_ids

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico (round 3). sd25/ccsd15/d211: Finalsite (round 3).
