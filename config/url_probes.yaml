# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Round 5 (2026-10-01). Round 4 answered Des Plaines: Communico's RSS feed
  # on calendar.dppl.org returned 200 application/rss+xml, 331 KB, and is now
  # the configured source. It also showed the Finalsite calendar IDs sit in
  # *unquoted* attributes (data-calendar-ids=361,349,360), which round 4's
  # quoted-only pattern missed.

  # Items 182/213, Palatine. 403 on rounds 1 and 4, 200 on rounds 2 and 3:
  # intermittent. Same fingerprint question as round 4.
  - url: https://www.palatinelibrary.org/events/upcoming
    item: 182
    purpose: Palatine library events - CMS and events-module fingerprint, any feed/export path
    patterns:
      - '(?i)\bdrupal\b[^"<]{0,40}'
      - '(?i)(?:librarymarket|library market|lc-calendar|lc_calendar|libraryaware|evanced|tockify|assabet|localist|trumba|wordpress|tribe-events)'
      - '(?i)[^"''\s<=]*/events?/(?:feed|rss|ical|ics|export|subscribe)[^"''\s<]*'
      - '(?i)<meta name="generator" content="[^"]*"'

  # Item 198: full Finalsite calendar-ID lists and any feed URL each page
  # advertises (D211's carries a data-calendars-feed-url attribute).
  - url: https://www.sd25.org/calendar-73
    item: 198
    purpose: D25 calendar page - full Finalsite calendar IDs and feed-URL attribute
    patterns: &finalsite_attrs
      - 'data-calendar-ids="?[\d,]+'
      - 'data-calendars?-feed-url="?[^"\s>]*'
  - url: https://www.ccsd15.net/our-district/calendars
    item: 198
    purpose: CCSD 15 calendars page - full Finalsite calendar IDs and feed-URL attribute
    patterns: *finalsite_attrs
  - url: https://adc.d211.org/district-info/info/calendars
    item: 198
    purpose: D211 calendars page - full Finalsite calendar IDs and feed-URL attribute
    patterns: *finalsite_attrs

  # Item 198: Finalsite's iCal endpoint with the IDs round 4 showed in full.
  # CCSD 15's list was cut off in round 4's context, so it waits a round.
  - url: https://www.sd25.org/fs/calendar-manager/events.ics?calendar_ids[]=361&calendar_ids[]=349&calendar_ids[]=360
    item: 198
    purpose: D25 - Finalsite iCal for calendar IDs 361, 349, 360 (candidate source)
  - url: https://adc.d211.org/fs/calendar-manager/events.ics?calendar_ids[]=27
    item: 198
    purpose: D211 - Finalsite iCal for calendar ID 27 (candidate source)

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico; its RSS feed is now the configured source (round 4).
  # - dppl.libnet.info: not DPPL's host (redirects to Google).
