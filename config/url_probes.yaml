# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Round 9 (2026-10-02). Round 8 answered item 221: both villages' CivicPlus
  # feeds work, and Palatine's news RSS, Palatine's Main Calendar iCal (19
  # events) and Wheeling's Main Calendar iCal are now configured sources.
  # It also found the Village of Mount Prospect's Revize site publishes
  # _includes_/published/news_list.json.

  # Item 192: the shape of Mount Prospect's news JSON, for a json fetcher.
  - url: https://www.mountprospect.org/_includes_/published/news_list.json
    item: 192
    purpose: Village of Mount Prospect news JSON (Revize) - its keys and one item's shape
    patterns:
      - '"[A-Za-z_]+"\s*:'
      - '"(?:title|name|headline)"\s*:\s*"[^"]{1,90}'
      - '"(?:date|pubdate|published|created|post_date|start)[A-Za-z_]*"\s*:\s*"[^"]{1,40}'
      - '"(?:url|link|href|path)"\s*:\s*"[^"]{1,120}'

  # Item 221: confirm Wheeling's Main Calendar iCal returns events, as Palatine's did.
  - url: https://www.wheelingil.gov/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar
    item: 221
    purpose: Wheeling Main Calendar iCal - event count (now the configured source)

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico; its RSS feed is now the configured source (round 4).
  # - dppl.libnet.info: not DPPL's host (redirects to Google).
  # - adc.d211.org: Finalsite calendar 27; its iCal is now the configured source (round 5).
  # - palatinelibrary.org/events/upcoming: Drupal 11 + LibraryCalendar, but no feed
  #   path in five rounds of patterns - next step is asking the library (item 152).
  # - www.ccsd15.net: Finalsite; the 8-ID calendar iCal is now the configured source (round 6).
  # - www.mountprospect.org/: moved to Revize, reachable (200); news and calendar paths found (round 6).
  # - mountprospect.org/news/index.php: JavaScript-rendered (Revize); no static article links (round 7).
  # - palatine.il.us + wheelingil.gov: CivicPlus; news RSS and Main Calendar (catID=14)
  #   iCal now configured (round 8). Both sites' /rss.aspx list their real feed IDs.
  # - ilpalatineweb.myvscloud.com (WebTrac): 403 from a runner (round 8, item 223).
  # - mountprospect.org/calendar/index.php: no calendar data URL; it lists only
  #   catalogue/news/job/bids JSON (round 8).
