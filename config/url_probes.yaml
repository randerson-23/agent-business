# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).
  # - Round 13/14 (items 282, 287): Harper College (Localist iCal 371 events, JSON API),
  #   Des Plaines Theatre and Metropolis (?ical=1: 30 and 21 events, now sources), Hey Nonny
  #   (OpenDate embed, no feed; an evergreen link).
  # - Round 15/16 (item 288): downtown and chamber directories. Downtown Arlington Heights
  #   is a script-rendered site and the Mount Prospect and Palatine directory pages hold no
  #   static business markup, so names cannot be read this way; the Arlington Heights, Mount
  #   Prospect and Des Plaines chamber domains were wrong guesses; Wheeling's is a 1 KB stub.


probes:
  # No open questions right now. Round 11 (2026-10-03) answered item 224's
  # site-side question: the live key file, home page, sitemap and robots.txt
  # are all correct, so the IndexNow 403 is on Bing's side (owner step,
  # item 204). Kept as a single cheap health check of the key file, since
  # the probe tests require at least one entry.
  - url: https://withintenmiles.com/f3b7799bed06aac4295ec9134d53b014.txt
    item: 224
    purpose: IndexNow key file on the live domain - still served and still equal to the key?
    patterns:
      - 'f3b7799bed06aac4295ec9134d53b014'

  # Round 18 (items 335 and 372): street addresses for venues, from each agency's own
  # pages. patterns catch "123 N Main St"-style addresses; `follow` opens one contact page.
  - url: https://www.ahpd.org/event/trunk-or-treat-2026/
    item: 372
    purpose: Arlington Heights Park District - the Trunk or Treat listing names Pioneer Park; does the page give its street address?
    patterns:
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
      - 'Pioneer Park'
    follow: 'contact|park-locations|parks'
  - url: https://desplainestheatre.com/
    item: 335
    purpose: Des Plaines Theatre - street address
    patterns:
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'contact|visit|directions'
  - url: https://www.metropolisarts.com/
    item: 335
    purpose: Metropolis Performing Arts Centre - street address
    patterns:
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'contact|visit|directions'
  - url: https://www.palatinelibrary.org/
    item: 335
    purpose: Palatine Public Library District - street address
    patterns:
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'contact|hours|locations'
  - url: https://www.dppl.org/
    item: 335
    purpose: Des Plaines Public Library - street address
    patterns:
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'contact|hours|locations'

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico; its RSS feed is now the configured source (round 4).
  # - dppl.libnet.info: not DPPL's host (redirects to Google).
  # - adc.d211.org: Finalsite calendar 27; its iCal is now the configured source (round 5).
  # - palatinelibrary.org/events/upcoming: Drupal 11 + LibraryCalendar, but no feed
  #   path in five rounds of patterns - next step is asking the library (item 152).
  # - www.ccsd15.net: Finalsite; the 8-ID calendar iCal is now the configured source (round 6).
  # - www.mountprospect.org/: moved to Revize, reachable (200); news and calendar paths found (round 6).
  # - mountprospect.org/news/index.php: JavaScript-rendered (Revize); no static article links (round 7).
  # - palatine.il.us + wheelingil.gov: CivicPlus; news RSS and Main Calendar (catID=14)
  #   iCal now configured (round 8). Both sites' /rss.aspx list their real feed IDs.
  # - ilpalatineweb.myvscloud.com (WebTrac): 403 from a runner (round 8, item 223).
  # - mountprospect.org/calendar/index.php: no calendar data URL; it lists only
  #   catalogue/news/job/bids JSON (round 8).
  # - wheelingil.gov Main Calendar iCal: 127 events (round 9); configured.
  # - mountprospect.org news_list.json: per-article JSON (round 9); configured as revize_news_json.
  # - sd25.org Finalsite iCal: valid but empty for 361, 349 and 360, together and each
  #   alone (rounds 5 and 10). D25 publishes nothing by iCal; ask the district (item 152).
  # - withintenmiles.com: key file, home page, sitemap and robots.txt all correct (round 11).
  # - vah.com Halloween page: 2026's page; 3-7 p.m. is standing guidance, not an
  #   ordinance; its Trunk-or-Treat date is still 2025's (round 12, item 218).
  # - mountprospect.org Calendar Event/22639: 404 (round 12, item 218).

  # Round 17 (item 292): mpdowntown.com/events/ has a "Downtown Trick-or-Treat"
  # section, but "2026" appeared only in a "2026 Events" heading. Capture the
  # section's text so the date, and whether it is this year's, can be read.
  - url: https://mpdowntown.com/events/
    item: 292
    purpose: Downtown Mount Prospect - full text of the Downtown Trick-or-Treat section (is it a 2026 date?)
    patterns:
      - '(?s)Downtown Trick-or-Treat</h3>.{0,900}'
      - '(?s)<h2>20\d\d Events</h2>.{0,200}'

  # Round 17 (item 286): Harper's Localist JSON API answered in round 13. These
  # patterns list the venue IDs, venue names and event types it uses, so the
  # source can be filtered at the API instead of guessing from titles.
  - url: https://events.harpercollege.edu/api/2/events?days=60&pp=100
    item: 286
    purpose: Harper College (Localist) - venue ids, venue names and event types in use
    patterns:
      - '"venue_id":\d+'
      - '"location_name":"[^"]{2,60}"'
      - '"event_types":\[[^\]]{0,200}\]'
      - '"filters":\{.{0,300}'

  # Round 18 (item 300): district calendar pages, to read days off from each
  # district's own document where no live feed works (D25, CCSD 21, D62, D214).
  - url: https://www.sd25.org/calendar
    item: 300
    purpose: Arlington Heights District 25 - does the calendar page list no-school dates in the HTML?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)(?:board|approved)[^<]{0,40}calendar[^<]{0,60}'
    follow: '(?i)calendar.*\.pdf|school-year-calendar|2026-?27'
  - url: https://ccsd21.org/parent-resources/calendars/
    item: 300
    purpose: Wheeling CCSD 21 - does the calendars page link a 2026-27 calendar and list no-school dates?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d62.org/calendars
    item: 300
    purpose: Des Plaines District 62 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d214.org/calendar
    item: 300
    purpose: High School District 214 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
