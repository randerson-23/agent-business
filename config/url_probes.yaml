# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).
  # - Round 13/14 (items 282, 287): Harper College (Localist iCal 371 events, JSON API),
  #   Des Plaines Theatre and Metropolis (?ical=1: 30 and 21 events, now sources), Hey Nonny
  #   (OpenDate embed, no feed; an evergreen link).
  # - Round 15/16 (item 288): downtown and chamber directories. Downtown Arlington Heights
  #   is a script-rendered site and the Mount Prospect and Palatine directory pages hold no
  #   static business markup, so names cannot be read this way; the Arlington Heights, Mount
  #   Prospect and Des Plaines chamber domains were wrong guesses; Wheeling's is a 1 KB stub.


probes:
  # No open questions right now. Round 11 (2026-10-03) answered item 224's
  # site-side question: the live key file, home page, sitemap and robots.txt
  # are all correct, so the IndexNow 403 is on Bing's side (owner step,
  # item 204). Kept as a single cheap health check of the key file, since
  # the probe tests require at least one entry.
  - url: https://withintenmiles.com/f3b7799bed06aac4295ec9134d53b014.txt
    item: 224
    purpose: IndexNow key file on the live domain - still served and still equal to the key?
    patterns:
      - 'f3b7799bed06aac4295ec9134d53b014'

  # Round 18 (items 335 and 372) answered and removed: the Des Plaines Theatre, Metropolis
  # and the Des Plaines library now have `venues:` rows; the Palatine library's page lists
  # only its two branches.

  # Round 19 (item 376): Pioneer Park's own page and the Napleton Palatine dealerships.
  - url: https://www.ahpd.org/parks/
    item: 376
    purpose: Arlington Heights Park District - park list; does Pioneer Park's page give its street address?
    patterns:
      - 'Pioneer Park'
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'pioneer'
  # Napleton answered (round 19): the home page carries no street addresses; the
  # Palatine dealerships' own pages would have to be found by hand.
  # Round 20 (item 323): each village's leaf-pickup page. Home page first, then the first link whose
  # href mentions leaf. Patterns pull the sentences that carry dates and rules.
  - url: https://events.harpercollege.edu/api/2/events?days=60&pp=100
    item: 286
    purpose: Harper College (Localist) - venue ids, venue names and event types in use
    patterns:
      - '"venue_id":\d+'
      - '"location_name":"[^"]{2,60}"'
      - '"event_types":\[[^\]]{0,200}\]'
      - '"filters":\{.{0,300}'

  # Round 18 (item 300): district calendar pages, to read days off from each
  # district's own document where no live feed works (D25, CCSD 21, D62, D214).
  - url: https://www.sd25.org/calendar
    item: 300
    purpose: Arlington Heights District 25 - does the calendar page list no-school dates in the HTML?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)(?:board|approved)[^<]{0,40}calendar[^<]{0,60}'
    follow: '(?i)calendar.*\.pdf|school-year-calendar|2026-?27'
  - url: https://ccsd21.org/parent-resources/calendars/
    item: 300
    purpose: Wheeling CCSD 21 - does the calendars page link a 2026-27 calendar and list no-school dates?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d62.org/calendars
    item: 300
    purpose: Des Plaines District 62 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d214.org/calendar
    item: 300
    purpose: High School District 214 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  # Round 22 answered (items 395, 397): Palatine HS Boosters' Fall Craft Fair is Sat Nov 7, 9-4 (phs.d211.org calendar);
  # the Village's winter market is 1st and 3rd Saturdays, Nov-Apr, 9-noon; the Park District's Merry Makers
  # Market page gives no readable date.
  # Round 23 (item 409): is the fair's own mailbox published on an organiser page?
  - url: https://www.mountprospect.org/
    item: 427
    purpose: Village of Mount Prospect - home page; a 2026 tree-lighting notice
    patterns:
      - '(?i)(?:tree[- ]lighting|christkindlmarket|busse pocket park)[^<]{0,160}'
      - '(?i)(?:toy|coat|food|donation|giving tree|toys for tots)[^<]{0,40}(?:drive|collection|tree)[^<]{0,120}'
    follow: '(?i)tree|lighting|holiday|christkindl'
  - url: https://mpdowntown.com/events/
    item: 427
    purpose: Downtown Mount Prospect - events page; tree lighting or Christkindlmarket dates
    patterns:
      - '(?i)(?:tree[- ]lighting|christkindlmarket|busse pocket park)[^<]{0,200}'
  - url: https://www.wheelingil.gov/
    item: 427
    purpose: Village of Wheeling - home page; Lights Around Wheeling or a tree-lighting notice
    patterns:
      - '(?i)(?:lights around wheeling|friendship park|tree[- ]lighting)[^<]{0,160}'
      - '(?i)(?:toy|coat|food|donation|giving tree|toys for tots)[^<]{0,40}(?:drive|collection|tree)[^<]{0,120}'
    follow: '(?i)lights|holiday|tree'
  - url: https://www.desplainesil.gov/
    item: 427
    purpose: City of Des Plaines - home page; a 2026 tree-lighting or holiday-event notice (also item 367)
    patterns:
      - '(?i)(?:tree[- ]lighting|holiday (?:tree|lights?)|christmas tree)[^<]{0,160}'
      - '(?i)(?:toy|coat|food|donation|giving tree|toys for tots)[^<]{0,40}(?:drive|collection|tree)[^<]{0,120}'
    follow: '(?i)tree|lighting|holiday'
  # Round 28 (item 427, 2026-11-01): Salt Creek answered (its calendar is The Events Calendar Pro and advertises
  # /events/?ical=1; now a Palatine source). Des Plaines' home page links its own "Holiday Tree Lighting and
  # Winter Fair" page: read the date.
  - url: https://www.desplainesil.gov/Departments/Media-Services/Events/Tree-Lighting-and-Winter-Fair
    item: 427
    purpose: "City of Des Plaines - Holiday Tree Lighting and Winter Fair page, the 2026 date, time and place"
    patterns:
      - '(?is)Holiday Tree Lighting at Metropolitan Square.{0,500}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}(?:st|nd|rd|th)?,? ?(?:20\d\d)?[^<]{0,80}'
      - '(?i)20\d\d[^<]{0,60}(?:tree|winter fair)'
  # Round 29 (items 438, 439, 2026-11-03): each park district's own camp / winter-break page, for the
  # "Park district camps" line on the winter-break pages, and River Trails' calendar for item 439.
  - url: https://www.rtpd.org/
    item: 439
    purpose: River Trails Park District - home page; an events calendar, a camp page, an ICS/webcal feed
    patterns:
      - '(?i)(?:winter|camp)[^<]{0,100}'
      - '(?i)(?:webcal:|\.ics|ical=1|calendar\.aspx)[^"<\s]{0,100}'
    follow: '(?i)camp|calendar|events'
  - url: https://www.mppd.org/
    item: 438
    purpose: Mount Prospect Park District - home page; its camps or winter-break programme page
    patterns:
      - '(?i)(?:winter break|camps?)[^<]{0,100}'
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
    follow: '(?i)camp|winter'
  - url: https://www.ahpd.org/
    item: 438
    purpose: Arlington Heights Park District - home page; its camps or winter-break programme page
    patterns:
      - '(?i)(?:winter break|camps?)[^<]{0,100}'
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
    follow: '(?i)camp|winter'
  - url: https://www.dpparks.org/
    item: 438
    purpose: Des Plaines Park District - home page; its camps or winter-break programme page
    patterns:
      - '(?i)(?:winter break|camps?)[^<]{0,100}'
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
    follow: '(?i)camp|winter'
  - url: https://www.wheelingparkdistrict.com/
    item: 438
    purpose: Wheeling Park District - home page; its camps or winter-break programme page
    patterns:
      - '(?i)(?:winter break|camps?)[^<]{0,100}'
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
    follow: '(?i)camp|winter'
  # Round 30 (item 438, 2026-11-04): round 29 found "Winter Break Programming" on Palatine Park District's home page
  # (no link text kept); mppd.org and dpparks.org only show summer camp pages; rtpd.org and wheelingparkdistrict.com
  # answer 403 "Just a moment" (a bot wall), ahpd.org timed out. Read the Palatine link target.
  - url: https://www.palatineparks.org/
    item: 438
    purpose: "Palatine Park District - the href behind the home page's Winter Break Programming link"
    patterns:
      - '(?is)<a[^>]{0,200}href="[^"]{1,200}"[^>]{0,200}>\s*Winter Break Programming'
      - '(?is)href="[^"]{0,200}winter[^"]{0,120}"'
  # Round 31 (item 441, 2026-11-04): toy, coat and food drives. Arlington Heights and Palatine here; the other three towns' home-page probes (items 427) carry the drive pattern too. Each village's home page, following the first link
  # that looks like a drive or giving notice; a 2026 source is required before anything goes in config/give.yaml.
  - url: https://www.vah.com/
    item: 441
    purpose: Village of Arlington Heights - home page; a 2026 toy, coat or food drive notice
    patterns:
      - '(?i)(?:toy|coat|food|donation|giving tree|toys for tots)[^<]{0,40}(?:drive|collection|tree)[^<]{0,120}'
      - '(?is)<a[^>]{0,300}href="[^"]{1,300}"[^>]{0,300}>(?:(?!</a>).){0,700}Community Food Drive'
      - '(?is)Community Food Drive.{0,600}'
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
    follow: '(?i)community[-_ %20]*food[-_ %20]*drive|toy|coat drive|giving|donat'
  - url: https://www.palatine.il.us/
    item: 441
    purpose: Village of Palatine - home page; a 2026 toy, coat or food drive notice
    patterns:
      - '(?i)(?:toy|coat|food|donation|giving tree|toys for tots)[^<]{0,40}(?:drive|collection|tree)[^<]{0,120}'
    follow: '(?i)toy|coat drive|food drive|giving|donat'
  # Round 32 (item 447, 2026-11-05): Toys for Tots' own Chicago campaign sites (found by search), for 2026 drop-off
  # lists and the last day. Mount Prospect's Toys for Kids is read from the village home page probe (follow: toy).
  - url: https://chicago-il.toysfortots.org/
    item: 447
    purpose: Toys for Tots Chicago campaign - home page; 2026 drop-off locations, last day, and the local drop form
    patterns:
      - '(?i)(?:drop[- ]?off|collection|last day|deadline)[^<]{0,120}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}(?:st|nd|rd|th)?,? ?(?:20\d\d)?[^<]{0,80}'
    follow: '(?i)drop|locations?|donate'
  - url: https://www.chicagolandtft.org/
    item: 447
    purpose: Chicagoland Toys for Tots - drop box locations across the region (2026)
    patterns:
      - '(?i)(?:drop[- ]?(?:box|off)|locations?)[^<]{0,120}'
      - '(?i)(?:Palatine|Arlington Heights|Mount Prospect|Des Plaines|Wheeling)[^<]{0,100}'
    follow: '(?i)drop|locations?'
  # Round 33 (item 441, 2026-11-06): the village's own Community Food Drive news item (link read from its home page
  # on Nov 5): organiser, drop-off places, last day.
  - url: https://www.vah.com/news_detail_T13_R609.php
    item: 441
    purpose: Village of Arlington Heights - Community Food Drive Nov 9-18 news item (organiser, drop-off sites, last day)
    patterns:
      - '(?is)Community Food Drive.{0,1500}'
      - '(?i)(?:drop[- ]?off|collection|donat)[^<]{0,200}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}(?:st|nd|rd|th)?[^<]{0,100}'
  # Round 34 (item 456, 2026-11-06): which platform each park district's registration catalogue runs on. The five home
  # page probes above now also capture register/catalogue hrefs; these two registration pages are named in the region configs.
  - url: https://www.dpparks.org/how-to-register/
    item: 456
    purpose: Des Plaines Park District - how to register page; the registration platform and catalogue link
    patterns:
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
  - url: https://www.wheelingparkdistrict.com/registration/
    item: 456
    purpose: Wheeling Park District - registration page; the registration platform and catalogue link
    patterns:
      - '(?i)href="[^"]*(?:activecommunities\.com|webtrac|rectrac|civicrec|myrec|amilia|register)[^"]{0,160}"'
  # Round 35 (item 456, 2026-11-06): platforms found by round 34 - Arlington Heights Park District runs ActiveNet
  # (anc.apm.activecommunities.com/ahpd, a JavaScript app), Des Plaines Park District runs WebTrac
  # (register.desplainesparks.org/webtrac), Wheeling is bot-walled, Mount Prospect and Palatine showed no register link on
  # their home pages. WebTrac's keyword search is a plain GET: read it for Santa events.
  - url: https://register.desplainesparks.org/webtrac/web/search.html?Action=Start&keyword=santa&keywordoption=Match+One&search=yes
    item: 456
    purpose: Des Plaines Park District WebTrac - keyword search for Santa programmes (names, dates, registration links)
    patterns:
      - '(?is)santa.{0,300}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}[^<]{0,80}'
      - '(?i)no (?:results|matches|activities)[^<]{0,80}'
  # Round 36 (item 458, 2026-11-06): neighbouring park districts' own Santa pages (found by search): read the 2026 date,
  # time and place before anything goes in config/just_outside.yaml.
  - url: https://www.skokieparks.org/events/breakfast-with-santa/26/
    item: 458
    purpose: Skokie Park District - Breakfast with Santa 2026 page (date, time, place, registration)
    patterns:
      - '(?is)Breakfast with Santa.{0,900}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? 20\d\d[^<]{0,80}'
  - url: https://niles-parks.org/calendar-list/event/7-breakfast-with-santa
    item: 458
    purpose: Niles Park District - Breakfast with Santa page (is there a 2026 date?)
    patterns:
      - '(?is)Breakfast with Santa.{0,900}'
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? 20\d\d[^<]{0,80}'
  # Round 37 (item 465, 2026-11-07): does Palatine Park District run The Events Calendar with a readable feed? If either
  # answers, its source moves from html_events to the tribe_events fetcher.
  - url: https://www.palatineparks.org/wp-json/tribe/events/v1/events?per_page=3
    item: 465
    purpose: Palatine Park District - The Events Calendar REST route (JSON with an "events" list?)
    patterns:
      - '"events"\s*:\s*\['
      - '"next_rest_url"[^,]{0,200}'
      - '"start_date"\s*:\s*"[^"]{0,30}"'
  - url: https://www.palatineparks.org/events/?ical=1
    item: 465
    purpose: Palatine Park District - The Events Calendar iCal export (BEGIN:VCALENDAR?)
    patterns:
      - 'BEGIN:VCALENDAR'
      - 'DTSTART[^\r\n]{0,40}'
  # Round 38 (item 466, 2026-11-07): the Rotary Club's own registration page for the Santa Run Walk & Reindeer Dash
  # (search says Sat Dec 5, 2026; Reindeer Dash for 10 and under at 9:30 AM). Read the date before adding it.
  - url: https://runsignup.com/Race/IL/ArlingtonHeights/RotaryClubSantaRun
    item: 466
    purpose: Arlington Heights Rotary Santa Run Walk & Reindeer Dash - registration page (2026 date, start times, place)
    patterns:
      - '(?i)(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? 20\d\d[^<]{0,80}'
      - '(?i)reindeer dash[^<]{0,160}'
      - '(?i)\d{1,2}:\d{2}\s*[ap]m[^<]{0,80}'
  # Round 39 (item 471, 2026-11-08): Palatine Public Library has 12 events against 238-412 for the other libraries,
  # read from the first page of its LibraryCalendar listing. Look for its RSS/iCal/JSON exports.
  - url: https://www.palatinelibrary.org/events
    item: 471
    purpose: Palatine Public Library - events page head and links; LibraryCalendar export paths (rss, ical, json, webcal)
    patterns:
      - '(?i)<link[^>]{0,200}type="application/(?:rss|atom)\+xml"[^>]{0,200}>'
      - '(?i)href="[^"]{0,200}(?:feed|\.ics|ical|webcal:|_format=json|/rss)[^"]{0,120}"'
      - '(?i)href="[^"]{0,120}[?&]page=\d+[^"]{0,60}"'
  - url: https://www.palatinelibrary.org/events/feed
    item: 471
    purpose: Palatine Public Library - LibraryCalendar feed path (RSS/XML?)
    patterns:
      - '(?i)<rss|<feed|BEGIN:VCALENDAR'
      - '(?i)<item>|<entry>'
  - url: https://www.ahml.info/events
    item: 471
    purpose: Arlington Heights Memorial Library - events page; same export patterns (238 events, 22-day horizon)
    patterns:
      - '(?i)<link[^>]{0,200}type="application/(?:rss|atom)\+xml"[^>]{0,200}>'
      - '(?i)href="[^"]{0,200}(?:feed|\.ics|ical|webcal:|_format=json|/rss)[^"]{0,120}"'
