# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Round 8 (2026-10-02). Item 221: Palatine is the last town with zero
  # weekend events. palatine.il.us and wheelingil.gov run CivicPlus
  # CivicEngage, which conventionally publishes RSS/iCal for calendar and
  # news. The feed URLs below are recalled conventions; each site's own
  # /rss.aspx index is probed too, so a real URL can replace a guess.

  # Item 221: Village of Palatine (CivicPlus; Main Calendar is CID=14).
  - url: https://www.palatine.il.us/rss.aspx
    item: 221
    purpose: Palatine - CivicPlus feed index; lists the site's own RSSFeed.aspx URLs
    patterns: &civic_feed_index
      - '(?i)RSSFeed\.aspx\?[^"''\s<]*'
      - '(?i)iCalendar\.aspx\?[^"''\s<]*'
  - url: https://www.palatine.il.us/RSSFeed.aspx?ModID=58&CID=All-calendar.xml
    item: 221
    purpose: Palatine - CivicPlus calendar RSS (recalled convention; candidate new source)
    patterns: &rss_items
      - '<item>'
      - '<title>[^<]{1,90}'
  - url: https://www.palatine.il.us/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml
    item: 221
    purpose: Palatine - CivicPlus news RSS (recalled convention; candidate swap for the 0-item news scrape)
    patterns: *rss_items
  - url: https://www.palatine.il.us/common/modules/iCalendar/iCalendar.aspx?catID=14&feed=calendar
    item: 221
    purpose: Palatine - CivicPlus iCal for the Main Calendar, catID=14 (recalled convention)

  # Item 221: Village of Wheeling (CivicPlus; its calendar scrape returns 2-3 items).
  - url: https://www.wheelingil.gov/rss.aspx
    item: 221
    purpose: Wheeling - CivicPlus feed index; lists the site's own RSSFeed.aspx URLs
    patterns: *civic_feed_index
  - url: https://www.wheelingil.gov/RSSFeed.aspx?ModID=58&CID=All-calendar.xml
    item: 221
    purpose: Wheeling - CivicPlus calendar RSS (recalled convention; candidate swap)
    patterns: *rss_items

  # Item 223: Palatine Park District's special events in Vermont Systems WebTrac.
  - url: https://ilpalatineweb.myvscloud.com/webtrac/web/search.html?module=AR&type=SPECEVNT
    item: 223
    purpose: Palatine Park District special events (WebTrac) - result rows, dates, any export link
    patterns:
      - '(?i)\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? 20\d\d'
      - '\b\d{1,2}/\d{1,2}/20\d\d\b'
      - '(?i)(?:export|ical|\.ics|rss|csv)[^"''\s<]{0,60}'

  # Item 192: round 7 found the Village of Mount Prospect's news and calendar
  # pages render in JavaScript (Revize RZ.* config, no static item links).
  # One more look for the data the calendar app loads.
  - url: https://www.mountprospect.org/calendar/index.php
    item: 192
    purpose: Village calendar (Revize) - the calendar app's data/source URL
    patterns:
      - '(?i)calendar_app[^"''\s<]*'
      - '(?i)[^"''\s<=(]*\.json\b[^"''\s<)]*'
      - '(?i)RZ\.webspace\s*=\s*["''][^"'']+'
      - '(?i)calendar_options[^;]{0,160}'

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico; its RSS feed is now the configured source (round 4).
  # - dppl.libnet.info: not DPPL's host (redirects to Google).
  # - adc.d211.org: Finalsite calendar 27; its iCal is now the configured source (round 5).
  # - palatinelibrary.org/events/upcoming: Drupal 11 + LibraryCalendar, but no feed
  #   path in five rounds of patterns - next step is asking the library (item 152).
  # - www.ccsd15.net: Finalsite; the 8-ID calendar iCal is now the configured source (round 6).
  # - www.mountprospect.org/: moved to Revize, reachable (200); news and calendar paths found (round 6).
  # - mountprospect.org/news/index.php: JavaScript-rendered (Revize); no static article links (round 7).
