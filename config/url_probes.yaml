# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question.

probes:
  # Item 182/213: Des Plaines and Palatine have contributed 0 weekend
  # events on every recorded build. Find each library's real feed link.
  - url: https://calendar.dppl.org/
    item: 182
    purpose: Des Plaines library - find the Springshare LibCal feed link
  - url: https://www.dppl.org/
    item: 182
    purpose: Des Plaines library home page - alternate link to the events feed
  - url: https://www.palatinelibrary.org/events/upcoming
    item: 182
    purpose: Palatine library - find the LibraryCalendar (lc_calendar_feed) iCal/RSS link

  # Item 198: school-district iCal feeds that 404 after a module-ID
  # rotation. The live calendar pages should link the current feed.
  - url: https://www.sd25.org/
    item: 198
    purpose: D25 - current calendar page / icalfeed.ashx MIID
  - url: https://www.ccsd15.net/
    item: 198
    purpose: CCSD 15 - current calendar page / icalfeed.ashx MIID
  - url: https://adc.d211.org/
    item: 198
    purpose: D211 - current calendar RSS ModuleInstanceID

  # Item 192 answered 2026-09-29: all five 403s are bot walls (Access
  # Denied / Cloudflare) from a GitHub runner too - see ROADMAP.md item 212.

  # Item 212 pricing anchor: a local competitor for the same sponsor budget.
  - url: https://www.mppd.org/sponsorship/
    item: 212
    purpose: Mount Prospect Park District sponsorship programme - package prices

  # Item 212 run 1: mppd.org advertises this text/calendar feed, while the
  # configured webcal://www.mppd.org/?post_type=tribe_events... URL times out.
  - url: https://www.mppd.org/events/?ical=1
    item: 181
    purpose: Mount Prospect Park District's advertised iCal feed - candidate source swap
