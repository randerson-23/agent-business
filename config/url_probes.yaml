# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Items 182/213: Des Plaines and Palatine have contributed 0 weekend
  # events on every recorded build. Both library calendars build their
  # subscribe links in JavaScript, so read the IDs out of the raw page.
  - url: https://calendar.dppl.org/
    item: 182
    purpose: Des Plaines library (Springshare LibCal) - the calendar cid its feed URL needs
    patterns:
      - 'cid=\d+'
      - 'ical_subscribe'
      - 'rss\.php'
      - '(?i)[a-z/._-]*ical[a-z/._?=&-]*'
  - url: https://www.palatinelibrary.org/events/upcoming
    item: 182
    purpose: Palatine library (LibraryCalendar) - does it expose an iCal/RSS wrapper format?
    patterns:
      - 'lc_calendar_feed'
      - '_wrapper_format=\w+'
      - '[\w/.-]*\.ics\b'
      - '(?i)[a-z/._-]*ical[a-z/._?=&-]*'

  # Item 198: school-district iCal feeds that 404 after a module-ID
  # rotation. The IDs live on each district's calendar page, so follow
  # the home page's first "calendar" link and look for them there.
  - url: https://www.sd25.org/
    item: 198
    purpose: D25 - current calendar module ID (MIID) for icalfeed.ashx
    follow: '(?i)calendar'
    patterns: &school_ids
      - 'MIID=\d+'
      - 'ModuleInstanceID=\d+'
      - '(?i)icalfeed[^"\s]*'
  - url: https://www.ccsd15.net/
    item: 198
    purpose: CCSD 15 - current calendar module ID (MIID) for icalfeed.ashx
    follow: '(?i)calendar'
    patterns: *school_ids
  - url: https://adc.d211.org/
    item: 198
    purpose: D211 - current calendar RSS ModuleInstanceID
    follow: '(?i)calendar'
    patterns: *school_ids

  # Item 212 pricing anchor: a local competitor for the same sponsor budget.
  - url: https://www.mppd.org/sponsorship/
    item: 212
    purpose: Mount Prospect Park District sponsorship programme - package prices
    patterns:
      - '\$\s?\d[\d,]*(?:\.\d\d)?'

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
