# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).

probes:
  # Round 6 (2026-10-01). Round 5 found D211's Finalsite iCal (200
  # text/calendar, 20 events; now the configured source) and captured CCSD
  # 15's two full calendar-ID lists. D25's iCal for 361,349,360 was valid but
  # empty (0 events) - recorded in ROADMAP.md, not re-probed this round.

  # Item 198: CCSD 15's Finalsite iCal, once per calendar element on its page.
  - url: https://www.ccsd15.net/fs/calendar-manager/events.ics?calendar_ids[]=70&calendar_ids[]=21&calendar_ids[]=40&calendar_ids[]=45&calendar_ids[]=22&calendar_ids[]=41&calendar_ids[]=68&calendar_ids[]=12
    item: 198
    purpose: CCSD 15 - Finalsite iCal for the first calendar element's 8 IDs (candidate source)
  - url: https://www.ccsd15.net/fs/calendar-manager/events.ics?calendar_ids[]=67&calendar_ids[]=45&calendar_ids[]=68&calendar_ids[]=11&calendar_ids[]=66&calendar_ids[]=15&calendar_ids[]=14&calendar_ids[]=39&calendar_ids[]=38&calendar_ids[]=27&calendar_ids[]=17&calendar_ids[]=10&calendar_ids[]=28&calendar_ids[]=21&calendar_ids[]=26&calendar_ids[]=19&calendar_ids[]=24&calendar_ids[]=40&calendar_ids[]=37&calendar_ids[]=36&calendar_ids[]=35&calendar_ids[]=34&calendar_ids[]=22&calendar_ids[]=33&calendar_ids[]=32&calendar_ids[]=25&calendar_ids[]=31&calendar_ids[]=41&calendar_ids[]=9&calendar_ids[]=29&calendar_ids[]=20&calendar_ids[]=12
    item: 198
    purpose: CCSD 15 - Finalsite iCal for the second calendar element's 32 IDs (candidate source)

  # Item 192 follow-up: both Village of Mount Prospect sources returned 404
  # (not 403) in PR #272's CI build. Find where news and the calendar moved.
  - url: https://www.mountprospect.org/
    item: 192
    purpose: Village of Mount Prospect home page - current news and calendar links (old paths now 404)
    follow: '(?i)calendar'
    patterns:
      - '(?i)href="[^"]*(?:news|calendar|events?|notify|rss)[^"]*"'
      - '(?i)\b(?:civicplus|civicengage|granicus|revize|govstack|opencities|drupal|wordpress)\b'

  # Answered and removed (see ROADMAP.md items 212 and 215):
  # - The five 403 sources: bot walls (Access Denied / Cloudflare) from a runner too.
  # - mppd.org/events/?ical=1: 200 with 0 bytes. Keep the configured webcal feed.
  # - www.dppl.org home page: links only the library's blog RSS.
  # - mppd.org/sponsorship/: no dollar amounts in the page; prices aren't published there.
  # - calendar.dppl.org: Communico; its RSS feed is now the configured source (round 4).
  # - dppl.libnet.info: not DPPL's host (redirects to Google).
  # - adc.d211.org: Finalsite calendar 27; its iCal is now the configured source (round 5).
  # - palatinelibrary.org/events/upcoming: Drupal 11 + LibraryCalendar, but no feed
  #   path in five rounds of patterns - next step is asking the library (item 152).
