# Open "what does this page actually serve?" questions (ROADMAP.md item 212).
#
# Both autonomous loops run in sandboxes with web egress blocked. Editing
# this file on main triggers .github/workflows/probe-urls.yml, which
# fetches each URL once from a GitHub runner and commits the answers to
# data/url_probes.json. Read the answers from origin/main; act on them in
# a normal PR. Probes never change source config by themselves.
#
# Remove an entry once its question is answered, so each run stays one
# polite request per open question (two when `follow` is set).
#
# Optional per-probe fields (item 215):
#   patterns: regexes run against the raw response body; each distinct
#             match is recorded with ~60 characters of context. Use this
#             for IDs that pages build into JavaScript rather than links.
#   follow:   a regex over the page's hrefs; the first matching link is
#             probed too (same patterns, one level deep, never further).
  # - Round 13/14 (items 282, 287): Harper College (Localist iCal 371 events, JSON API),
  #   Des Plaines Theatre and Metropolis (?ical=1: 30 and 21 events, now sources), Hey Nonny
  #   (OpenDate embed, no feed; an evergreen link).
  # - Round 15/16 (item 288): downtown and chamber directories. Downtown Arlington Heights
  #   is a script-rendered site and the Mount Prospect and Palatine directory pages hold no
  #   static business markup, so names cannot be read this way; the Arlington Heights, Mount
  #   Prospect and Des Plaines chamber domains were wrong guesses; Wheeling's is a 1 KB stub.


probes:
  # No open questions right now. Round 11 (2026-10-03) answered item 224's
  # site-side question: the live key file, home page, sitemap and robots.txt
  # are all correct, so the IndexNow 403 is on Bing's side (owner step,
  # item 204). Kept as a single cheap health check of the key file, since
  # the probe tests require at least one entry.
  - url: https://withintenmiles.com/f3b7799bed06aac4295ec9134d53b014.txt
    item: 224
    purpose: IndexNow key file on the live domain - still served and still equal to the key?
    patterns:
      - 'f3b7799bed06aac4295ec9134d53b014'

  # Round 18 (items 335 and 372) answered and removed: the Des Plaines Theatre, Metropolis
  # and the Des Plaines library now have `venues:` rows; the Palatine library's page lists
  # only its two branches.

  # Round 19 (item 376): Pioneer Park's own page and the Napleton Palatine dealerships.
  - url: https://www.ahpd.org/parks/
    item: 376
    purpose: Arlington Heights Park District - park list; does Pioneer Park's page give its street address?
    patterns:
      - 'Pioneer Park'
      - '\b\d{2,5}\s+(?:[NSEW]\.?\s+)?[A-Z][A-Za-z]+(?:\s+[A-Z][A-Za-z]+)?\s+(?:Ave|Avenue|St|Street|Rd|Road|Blvd|Dr|Drive|Ln|Lane)\b'
    follow: 'pioneer'
  # Napleton answered (round 19): the home page carries no street addresses; the
  # Palatine dealerships' own pages would have to be found by hand.
  # Round 20 (item 323): each village's leaf-pickup page. Home page first, then the first link whose
  # href mentions leaf. Patterns pull the sentences that carry dates and rules.
  - url: https://events.harpercollege.edu/api/2/events?days=60&pp=100
    item: 286
    purpose: Harper College (Localist) - venue ids, venue names and event types in use
    patterns:
      - '"venue_id":\d+'
      - '"location_name":"[^"]{2,60}"'
      - '"event_types":\[[^\]]{0,200}\]'
      - '"filters":\{.{0,300}'

  # Round 18 (item 300): district calendar pages, to read days off from each
  # district's own document where no live feed works (D25, CCSD 21, D62, D214).
  - url: https://www.sd25.org/calendar
    item: 300
    purpose: Arlington Heights District 25 - does the calendar page list no-school dates in the HTML?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)(?:board|approved)[^<]{0,40}calendar[^<]{0,60}'
    follow: '(?i)calendar.*\.pdf|school-year-calendar|2026-?27'
  - url: https://ccsd21.org/parent-resources/calendars/
    item: 300
    purpose: Wheeling CCSD 21 - does the calendars page link a 2026-27 calendar and list no-school dates?
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d62.org/calendars
    item: 300
    purpose: Des Plaines District 62 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  - url: https://www.d214.org/calendar
    item: 300
    purpose: High School District 214 - official 2026-27 calendar
    patterns:
      - '(?i)no school[^<]{0,80}'
      - '(?i)2026[-–/ ]?(?:20)?27[^<]{0,60}'
    follow: '(?i)2026-?27|\.pdf'
  # Round 22 answered (items 395, 397): Palatine HS Boosters' Fall Craft Fair is Sat Nov 7, 9-4 (phs.d211.org calendar);
  # the Village's winter market is 1st and 3rd Saturdays, Nov-Apr, 9-noon; the Park District's Merry Makers
  # Market page gives no readable date.
  # Round 23 (item 409): is the fair's own mailbox published on an organiser page?
  - url: https://www.mountprospect.org/
    item: 427
    purpose: Village of Mount Prospect - home page; a 2026 tree-lighting notice
    patterns:
      - '(?i)(?:tree[- ]lighting|christkindlmarket|busse pocket park)[^<]{0,160}'
    follow: '(?i)tree|lighting|holiday|christkindl'
  - url: https://mpdowntown.com/events/
    item: 427
    purpose: Downtown Mount Prospect - events page; tree lighting or Christkindlmarket dates
    patterns:
      - '(?i)(?:tree[- ]lighting|christkindlmarket|busse pocket park)[^<]{0,200}'
  - url: https://www.wheelingil.gov/
    item: 427
    purpose: Village of Wheeling - home page; Lights Around Wheeling or a tree-lighting notice
    patterns:
      - '(?i)(?:lights around wheeling|friendship park|tree[- ]lighting)[^<]{0,160}'
    follow: '(?i)lights|holiday|tree'
  - url: https://www.desplainesil.gov/
    item: 427
    purpose: City of Des Plaines - home page; a 2026 tree-lighting or holiday-event notice (also item 367)
    patterns:
      - '(?i)(?:tree[- ]lighting|holiday (?:tree|lights?)|christmas tree)[^<]{0,160}'
    follow: '(?i)tree|lighting|holiday'
  - url: https://www.saltcreekpd.com/
    item: 428
    purpose: Salt Creek Rural Park District (Palatine) - home page; Breakfast with Santa or other Santa events, any events feed link
    patterns:
      - '(?i)santa[^<]{0,160}'
      - '(?i)(?:ical|\.ics|/events)[^"<]{0,80}'
    follow: '(?i)santa|events'
  - url: https://www.saltcreekpd.com/events/?ical=1
    item: 428
    purpose: Salt Creek Rural Park District - The Events Calendar iCal feed, if it has one
    patterns:
      - 'BEGIN:VEVENT'
